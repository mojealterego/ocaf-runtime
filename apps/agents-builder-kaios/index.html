<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCAF Agents Builder KaiOS</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>OCAF Agents Builder</strong><small>KaiOS · tryb uproszczony</small></header>
<main>
<label>Projekt <input id="project" maxlength="48" value="agent" autocomplete="off"></label>
<div class="controls"><button id="code" type="button">Code</button><button id="nocode" type="button">NoCode</button></div>
<label>Środowisko <select id="workspace"><option value="local">Lokalnie</option><option value="cloud">Chmura (niedostępna)</option></select></label>
<section id="nocode-panel"><h2>Węzły</h2><ol id="nodes"></ol><label>Nowy węzeł <input id="node-name" maxlength="48"></label><button id="add" type="button">Dodaj węzeł</button></section>
<section id="code-panel" hidden><h2>Projekt JSON</h2><textarea id="source" rows="8" spellcheck="false"></textarea><button id="apply" type="button">Zastosuj JSON</button></section>
<section id="canonical-panel"><h2>Kanoniczny DAG OCAF (walidacja)</h2><label>Tenant <input id="canonical-tenant" value="local" maxlength="64"></label><label>ID projektu DAG <input id="canonical-id" value="agent" maxlength="64"></label><textarea id="canonical-source" rows="8" spellcheck="false" aria-label="Kanoniczny JSON DAG"></textarea><div class="controls"><button id="canonical-new" type="button">Nowy graf</button><button id="canonical-transform" type="button">Dodaj Transform</button><button id="canonical-remove" type="button">Usuń Transform</button><button id="canonical-tool" type="button">Dodaj Tool</button><button id="canonical-remove-tool" type="button">Usuń Tool</button><button id="canonical-rename" type="button">Zmień ID węzła</button><button id="canonical-duplicate" type="button">Duplikuj Transform</button><button id="canonical-retype" type="button">Zmień typ grafu</button><button id="canonical-update-cost" type="button">Zmień koszt Tool</button><button id="canonical-rename-tool" type="button">Zmień narzędzie Tool</button><button id="canonical-insert-edge" type="button">Wstaw Transform na krawędzi</button></div><label>Od węzła <input id="canonical-edge-from" maxlength="64" value="input"></label><label>Do węzła <input id="canonical-edge-to" maxlength="64" value="output"></label><label>ID Transform <input id="canonical-node-id" maxlength="64" value="transform1"></label><label>Nowe ID węzła <input id="canonical-new-node-id" maxlength="64" value="renamed"></label><label>Nazwa narzędzia <input id="canonical-tool-name" maxlength="64" value="example.tool"></label><label>Koszt narzędzia (jednostki minimalne) <input id="canonical-tool-cost" type="number" min="1" max="1000000000000" value="1"></label><label>Typ portów <select id="canonical-port-kind"><option value="text">text</option><option value="json">json</option><option value="bytes">bytes</option></select></label><button id="canonical-check" type="button">Sprawdź DAG</button><button id="canonical-save" type="button">Zapisz DAG lokalnie</button><button id="canonical-load" type="button">Otwórz DAG</button><button id="canonical-export" type="button">Eksportuj DAG</button><label>Import DAG JSON <textarea id="canonical-import" rows="5" spellcheck="false"></textarea></label><button id="canonical-import-button" type="button">Importuj DAG</button><pre id="canonical-result" aria-live="polite"></pre><h3>Podgląd połączeń DAG</h3><ol id="canonical-graph-preview" aria-label="Połączenia kanonicznego DAG"></ol></section>
<div class="controls"><button id="save" type="button">Zapisz</button><button id="load" type="button">Otwórz</button></div>
<p id="status" role="status" aria-live="polite">Gotowy. Narzędzia nie są wykonywane.</p>
</main><script src="canonical-graph.js"></script><script src="app.js"></script><script src="canonical-ui.js"></script></body></html>
