[package]
name = "ocaf-agents-builder-desktop"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
tauri = { version = "2", default-features = true }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2" }

[workspace]
