[workspace]
members = ["core", "packages/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
ocaf-import-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time"] }
zenoh = { version = "1.10", default-features = false, features = ["transport_tcp", "transport_tls"] }

[patch.crates-io]
zenoh-transport = { path = "../vendor/zenoh-transport" }
token-cell = { path = "../vendor/token-cell" }
zenoh-config = { path = "../vendor/zenoh-config" }
zenoh-link-commons = { path = "../vendor/zenoh-link-commons" }
zenoh-link-tls = { path = "../vendor/zenoh-link-tls" }
