name: OCAF 0.39 Privileged KVM kernel capability (GitHub Linux)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage039-privileged-kvm-probe.yml
      - scripts/stage039_kvm_ioctl.py
      - scripts/stage039_microvm_gate.py
      - scripts/stage039_live_egress.py
      - stage039/aya-guard/**
      - stage039/aya-ebpf-egress/prebuilt/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-kvm-root-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Observe real /dev/kvm device and ioctl as privileged root
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p stage039-privileged-evidence
          echo "HOST_KERNEL=$(uname -r)"
          echo "PID1=$(cat /proc/1/comm)"
          stat -c 'DEV_KVM=%F PERMS=%a OWNER=%U GROUP=%G' /dev/kvm || true
          if ! sudo -n true; then
            echo "::error::Hosted Linux lacks passwordless sudo"
            exit 1
          fi
          set +e
          sudo -n python3 scripts/stage039_kvm_ioctl.py \
            --report stage039-privileged-evidence/actual-root-kvm-ioctl.json
          rc=$?
          set -e
          test "$rc" -eq 0 || test "$rc" -eq 1
          sudo -n chown "$(id -u):$(id -g)" stage039-privileged-evidence/actual-root-kvm-ioctl.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage039-privileged-evidence/actual-root-kvm-ioctl.json").read_text())
          print("STAGE039_PRIVILEGED_KVM_REAL_HOST_REPORT",json.dumps({
              "status":r["status"],"kvm_vm_fd_created":r["kvm_vm_fd_created"],
              "checks":r["checks"]},sort_keys=True))
          if r["status"]=="KVM_IOCTL_VM_CREATED_NOT_BOOTED":
              assert r["api_version_verified"] is True
              assert r["kvm_vm_fd_created"] is True
              print("STAGE039_REAL_KERNEL_KVM_CREATE_VM_PROVED")
          elif r["status"]=="NO_GO":
              assert r["kvm_vm_fd_created"] is False
              print("STAGE039_REAL_KERNEL_KVM_PRIVILEGED_ACCESS_DENIED_OR_UNAVAILABLE")
          else:
              raise SystemExit("Unknown KVM status")
          assert r["microvm_launched"] is False
          assert r["ebpf_attached"] is False
          assert r["production_approved"] is False
          PY
      - name: Verify pinned eBPF ELF and compile actual Aya loader
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --manifest-path stage039/aya-guard/Cargo.toml --release
          file stage039/aya-guard/target/release/ocaf-stage039-aya-guard
          test -x stage039/aya-guard/target/release/ocaf-stage039-aya-guard
          file stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf
          echo '992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95  stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf' | sha256sum --check --
      - name: REAL Aya BPF_PROG_LOAD cgroup attach and two-tenant egress negative test
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$PWD"
          AYA="$ROOT/stage039/aya-guard/target/release/ocaf-stage039-aya-guard"
          ELF="$ROOT/stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf"
          LOADER_SHA="$(sha256sum "$AYA" | cut -d ' ' -f 1)"
          sudo -n python3 scripts/stage039_live_egress.py \
            --loader "$AYA" --loader-sha256 "$LOADER_SHA" \
            --program "$ELF" \
            --program-sha256 992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95 \
            --seconds 15 \
            --report stage039-privileged-evidence/actual-root-aya-egress.json \
            --ack-privileged-loopback-test
          sudo -n chown "$(id -u):$(id -g)" stage039-privileged-evidence/actual-root-aya-egress.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("stage039-privileged-evidence/actual-root-aya-egress.json").read_text())
          assert report["status"]=="KERNEL_EBPF_EGRESS_ISOLATION_PASSED"
          assert report["tenant_a_denied_during_attachment"] is True
          assert report["tenant_b_not_blocked"] is True
          assert report["tenant_a_recovered_after_detach"] is True
          assert report["production_approved"] is False
          assert report["microvm_booted"] is False
          print("STAGE039_REAL_GITHUB_KERNEL_AYA_TWO_TENANT_EGRESS_PROVEN")
          PY
      - name: Archive factual root-level KVM ioctl report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage039-actual-github-root-kvm-evidence
          path: stage039-privileged-evidence/
          retention-days: 30
          if-no-files-found: warn
