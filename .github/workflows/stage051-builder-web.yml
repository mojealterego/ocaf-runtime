name: OCAF 0.51 Agents Builder web Code and NoCode

on:
  push:
    branches: [main]
    paths:
      - apps/agents-builder-web/**
      - scripts/tests/test_agents_builder_local_runner.py
      - tests/builder_web_contract.rs
      - src/builder_core.rs
      - .github/workflows/stage051-builder-web.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-code-nocode:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Web editor syntax
        run: |
          node --check apps/agents-builder-web/editor.mjs
          node --check apps/agents-builder-web/app.mjs
          node --check apps/agents-builder-web/cloud.mjs
          node --check apps/agents-builder-web/i18n.mjs
          node --check apps/agents-builder-web/credentials.mjs
          node --check apps/agents-builder-web/models.mjs
          node --check apps/agents-builder-web/integrations-ui.mjs
          node --check apps/agents-builder-web/runner-client.mjs
      - name: Python local GGUF process and HTTP boundary tests
        run: python3 -m unittest discover -s scripts/tests -p test_agents_builder_local_runner.py -v
      - name: Web editor model contract
        run: node --test apps/agents-builder-web/tests/*.test.mjs
      - name: Chromium GUI end-to-end smoke
        run: |
          command -v google-chrome
          node apps/agents-builder-web/tests/browser-smoke.mjs
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - name: Rust and web shared fixture
        run: cargo test --locked --no-default-features --test builder_web_contract
