# Short-lived dependency minimization; this job is deleted after lock refresh.
name: Zenoh Lockfile Refresh
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/lockfile-refresh.yml"]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-resolve minimal transport dependency graph
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          python3 scripts/supply_chain.py --repo .
      - name: Commit newly resolved lockfile directly on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "build(deps): minimize Zenoh transport dependencies in Cargo.lock"
          git push origin HEAD:main
