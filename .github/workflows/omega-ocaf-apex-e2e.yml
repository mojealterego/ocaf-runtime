name: OMEGA OCAF APEX E2E validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/omega-ocaf-apex/**'
      - '.github/workflows/omega-ocaf-apex-e2e.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate integration contract
        run: python3 integrations/omega-ocaf-apex/validate.py
      - name: Live OpenAI inference (when configured)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: python3 integrations/omega-ocaf-apex/openai_probe.py
      - name: Report unavailable inference evidence
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo 'Live inference NOT VERIFIED; configure OPENAI_API_KEY repository secret.'
