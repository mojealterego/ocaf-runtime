name: OCAF 0.38 Real TLS/mTLS Integration (CI only; NO-GO)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage038-mtls-integration.yml"
      - "src/**"
      - "tests/tls_bound_identity.rs"
      - "tests/zenoh_mtls_e2e.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocaf038-real-mtls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tls-mtls:
    name: Real TLS 1.3 mutual authentication and rejection tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up locked Rust compiler
        uses: dtolnay/rust-toolchain@stable
      - name: Test TLS-bound RPC with actual ephemeral certificates
        run: cargo test --locked --features tls-bound --test tls_bound_identity -- --test-threads=1
      - name: Test actual Zenoh mTLS handshakes and rejection
        run: cargo test --locked --features zenoh --test zenoh_mtls_e2e -- --test-threads=1
      - name: Record evidence without credential or certificate contents
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          report = {
              "schema_version": 1,
              "commit": os.environ["GITHUB_SHA"],
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "runner": "ubuntu-24.04",
              "tests": [
                  "tls_bound_identity real TLS 1.3 authenticated RPC",
                  "zenoh_mtls_e2e real mTLS handshake and denied rogue credentials",
              ],
              "ephemeral_test_certificates_only": True,
              "multi_host_staging_certified": False,
              "signed_wasi_systemd_service_certified": False,
              "independent_security_audit": False,
              "stage_038_complete": False,
              "production_approved": False,
              "result": "CI_MTLS_TEST_PASS_NOT_OPERATOR_SIGNOFF",
          }
          Path("stage038-tls-mtls-ci-evidence.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Archive synthetic CI result, not private key material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocaf038-real-mtls-ci-evidence
          path: stage038-tls-mtls-ci-evidence.json
          if-no-files-found: warn
          retention-days: 30
