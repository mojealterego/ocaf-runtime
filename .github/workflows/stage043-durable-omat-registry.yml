name: OCAF 0.43 durable OMAt registry and Zenoh discovery
on:
  push:
    branches: [main]
    paths:
      - src/stage043_store.rs
      - src/stage043_omat_discovery.rs
      - src/stage043_omat_zenoh.rs
      - src/stage043_omat_revoke_zenoh.rs
      - src/bin/ocaf-omat-zenoh.rs
      - tests/stage043_durable_discovery.rs
      - tests/stage043_revoke_zenoh.rs
      - .github/workflows/stage043-durable-omat-registry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --features zenoh --bin ocaf-omat-zenoh
      - run: cargo test --locked --no-default-features --test stage043_persistence
      - run: cargo test --locked --features zenoh --test stage043_durable_discovery --test stage043_revoke_zenoh
