# One-time compatibility backport; validates before direct main commit.
name: Backport Token Cell Pastey
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/token-cell-pastey-backport.yml"]
permissions:
  contents: read

jobs:
  validate-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Retrieve and patch Cargo-validated token-cell source
        run: |
          set -euo pipefail
          cargo fetch --locked
          python3 scripts/vendor_token_cell.py --repo . --source-home "${CARGO_HOME:-$HOME/.cargo}"
          cargo generate-lockfile
          python3 scripts/supply_chain.py --repo .
          python3 scripts/zenoh_feature_policy.py --repo .
      - name: Negative guards and integration tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
          cargo fmt --all -- --check
          cargo test --locked --no-default-features
          cargo test --locked --test transport_policy --test zenoh_e2e --test zenoh_mtls_e2e
          cargo clippy --locked --all-targets -- -D warnings
      - name: Verify token-cell and pastey exclusive resolution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages=tomllib.loads(Path("Cargo.lock").read_text())["package"]
          def matches(name):
              return [p for p in packages if p["name"]==name]
          assert not matches("paste"), "unmaintained paste remains"
          assert [p["version"] for p in matches("pastey")]==["0.2.3"]
          token=matches("token-cell")
          assert len(token)==1 and token[0]["version"]=="2.1.1" and "source" not in token[0]
          assert [p["version"] for p in matches("lz4_flex")]==["0.11.6"]
          print("RUSTSEC-2024-0436 removed from resolved dependency graph")
          PY
      - name: Commit verified source backport on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/token-cell-pastey-backport.yml
          git add Cargo.toml Cargo.lock vendor/token-cell
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): replace unmaintained paste with pastey in token-cell backport"
          git push origin HEAD:main
