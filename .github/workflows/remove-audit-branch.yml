name: Remove superseded audit branch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-audit-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'mojealterego/ocaf-runtime' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the merged temporary audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/audit/security-hardening-2026-10-12"
