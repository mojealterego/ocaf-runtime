name: OCAF agent artifact contract (Rust, fail-closed)
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  agent-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Build and test standalone Rust structural validator
        run: |
          rustc --edition=2021 --test scripts/ocaf_agent_artifact_gate.rs -o /tmp/ocaf-artifact-gate-tests
          /tmp/ocaf-artifact-gate-tests
          rustc --edition=2021 scripts/ocaf_agent_artifact_gate.rs -o /tmp/ocaf-artifact-gate
      - name: Reject undeveloped agent/source directories
        run: /tmp/ocaf-artifact-gate .
