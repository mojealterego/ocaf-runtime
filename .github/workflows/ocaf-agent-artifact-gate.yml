name: OCAF agent artifact contract (Rust, fail-closed)
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  agent-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify 111 named draft packages and 33 swarm membership manifests
        run: |
          python3 -m unittest scripts.tests.test_agent_fleet_supervisor -v
          python3 scripts/ocaf_agent_fleet_supervisor.py --log "$RUNNER_TEMP/ocaf-fleet-inventory.jsonl"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Build and test standalone Rust structural validator
        run: |
          rustc --edition=2021 --test scripts/ocaf_agent_artifact_gate.rs -o /tmp/ocaf-artifact-gate-tests
          /tmp/ocaf-artifact-gate-tests
          rustc --edition=2021 scripts/ocaf_agent_artifact_gate.rs -o /tmp/ocaf-artifact-gate
      - name: Gate implemented components and report planned sources without certification
        run: /tmp/ocaf-artifact-gate .
      - name: Ensure planned agents cannot pass release certification
        shell: bash
        run: |
          set -euo pipefail
          if /tmp/ocaf-artifact-gate . --release > "$RUNNER_TEMP/ocaf-release-denied.log" 2>&1; then
            echo "Unsafe: release gate accepted planned/unverified sources" >&2
            exit 1
          fi
          grep -q "NOT CERTIFIED" "$RUNNER_TEMP/ocaf-release-denied.log"
          echo "Release gate correctly rejected incomplete agent fleet"
