name: OCAF Agents Builder native Windows and macOS builds

on:
  push:
    branches: [main]
    paths:
      - "apps/agents-builder-desktop/**"
      - "apps/agents-builder-web/**"
      - "scripts/tests/test_builder_native_desktop.py"
      - "scripts/verify_native_artifact.py"
      - "scripts/tests/test_verify_native_artifact.py"
      - "rust-toolchain.toml"
      - ".github/workflows/agents-builder-native-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-desktop:
    name: Native Tauri compile / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            executable: ocaf-agents-builder-desktop.exe
          - os: macos-latest
            artifact: macos
            executable: ocaf-agents-builder-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.99.0'
      - name: Verify artifact verifier regression tests
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -p test_verify_native_artifact.py -v
      - name: Test native process smoke harness
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -p test_smoke_native_desktop.py -v
      - name: Check native source contracts
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -p test_builder_native_desktop.py -v
      - name: Generate required Tauri icons
        shell: bash
        run: python3 scripts/generate_builder_icons.py
      - name: Generate macOS ICNS from the deterministic PNG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          icons="apps/agents-builder-desktop/src-tauri/icons"
          mkdir -p "$icons/icon.iconset"
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" "$icons/icon.png" --out "$icons/icon.iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" "$icons/icon.png" --out "$icons/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$icons/icon.iconset" -o "$icons/icon.icns"
      - name: Compile actual platform-native Tauri executable
        shell: bash
        run: cargo build --release --manifest-path apps/agents-builder-desktop/src-tauri/Cargo.toml
      - name: Verify executable binary format
        shell: bash
        run: python3 scripts/verify_native_artifact.py '${{ matrix.artifact }}' 'apps/agents-builder-desktop/src-tauri/target/release/${{ matrix.executable }}'
      - name: Launch native desktop executable smoke
        shell: bash
        run: python3 scripts/smoke_native_desktop.py 'apps/agents-builder-desktop/src-tauri/target/release/${{ matrix.executable }}' --seconds 5
      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "ocaf-agents-builder-${{ matrix.artifact }}-${{ github.sha }}"
          path: apps/agents-builder-desktop/src-tauri/target/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 30
