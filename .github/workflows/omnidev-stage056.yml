name: OCAF 0.56 OmniDev typed Rust DAG contract
on:
  push:
    branches: ["main"]
    paths:
      - "src/omnidev_workflow.rs"
      - "src/lib.rs"
      - "scripts/omnidev_tree_sitter.py"
      - "scripts/tests/test_omnidev_tree_sitter.py"
      - "scripts/omnidev_pipeline.py"
      - "scripts/omnidev_cli.py"
      - "scripts/omnidev_semantic_critic.py"
      - "scripts/tests/test_omnidev_semantic_critic.py"
      - "scripts/tests/test_omnidev_pipeline.py"
      - "tests/omnidev_workflow.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omnidev-stage056.yml"
  pull_request:
    paths:
      - "src/omnidev_workflow.rs"
      - "src/lib.rs"
      - "scripts/omnidev_tree_sitter.py"
      - "scripts/tests/test_omnidev_tree_sitter.py"
      - "scripts/omnidev_pipeline.py"
      - "scripts/omnidev_cli.py"
      - "scripts/omnidev_semantic_critic.py"
      - "scripts/tests/test_omnidev_semantic_critic.py"
      - "scripts/tests/test_omnidev_pipeline.py"
      - "tests/omnidev_workflow.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omnidev-stage056.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - name: Install pinned Rust Tree-sitter grammar
        run: python3 -m pip install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - name: Real Rust CST parser and impact tests
        run: python3 -m unittest discover -s scripts/tests -p test_omnidev_tree_sitter.py -v
      - name: Test complete OmniDev patch pipeline and recovery
        run: python3 -m unittest discover -s scripts/tests -p test_omnidev_pipeline.py -v
      - name: AST and CST security critic negative tests
        run: python3 -m unittest discover -s scripts/tests -p test_omnidev_semantic_critic.py -v
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Typed DAG role, tenant, lease, replay and cost tests
        run: cargo test --locked --no-default-features --test omnidev_workflow
      - name: Strict Clippy for OmniDev contract
        run: cargo clippy --locked --no-default-features --test omnidev_workflow -- -D warnings
