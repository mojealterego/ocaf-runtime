name: Rust CI
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: ocaf
          POSTGRES_PASSWORD: ocaf_local_test_password
          POSTGRES_DB: ocaf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocaf -d ocaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OCAF_TEST_PG_DSN: "host=127.0.0.1 port=5432 user=ocaf password=ocaf_local_test_password dbname=ocaf_test sslmode=disable"
      OCAF_REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned Tree-sitter Rust grammar for OmniDev semantic tests
        run: python3 -m pip install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - name: Offline release precheck unit tests (Python 3.11+)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Release evidence inventory (development only; not a release gate)
        run: python3 scripts/release_readiness.py --repo . --report-only
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - name: Committed Cargo.lock integrity
        run: python3 scripts/supply_chain.py --repo .
      - name: Compile-time Zenoh transport and compression restrictions
        run: python3 scripts/zenoh_feature_policy.py --repo .
      - name: mTLS certificate lifecycle with real ephemeral OpenSSL PKI
        run: python3 -m unittest discover -s scripts/tests -p test_mtls_lifecycle.py -v
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (core only)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: OmniDev 0.56 Cargo workspace graph (locked offline, no candidate execution)
        run: python3 scripts/omnidev_workspace_graph.py --repo .
      - name: Argon document DAG and SQLite replay acceptance (early deterministic gate)
        run: |
          cargo test --locked --no-default-features --test document_function_dag
          cargo test --locked --no-default-features --lib document_store
          cargo test --locked --no-default-features --lib model_router
          cargo test --locked --no-default-features --lib compound_reasoning
          cargo test --locked --no-default-features --lib agentic_prompt_dsl
          cargo test --locked --no-default-features --lib collaboration_tracker
          cargo test --locked --no-default-features --lib voice_narrative_firewall
      - name: Pinned Wasmtime 49.0.2 real WASI command acceptance
        run: bash scripts/wasmtime_acceptance.sh
      - name: Upload reproducible WASI host resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasi-host-acceptance
          path: wasi-host-acceptance.json
          if-no-files-found: warn
          retention-days: 30
      - name: X.509 leaf-key proof-of-possession and RPC sender acceptance
        run: cargo test --locked --no-default-features --test rpc_cert_identity
      - name: HMAC peer key cutover and replay identity acceptance
        run: cargo test --locked --no-default-features --test rpc_key_rotation
      - name: Tests (core only)
        run: cargo test --locked --no-default-features
      - name: Final security acceptance (cluster isolation and fencing)
        run: cargo test --locked --no-default-features --test final_security_acceptance -- --test-threads=1
      - name: Final replay acceptance (cluster isolation and nonce fencing)
        run: cargo test --locked --no-default-features --test final_replay_acceptance -- --test-threads=1
      - name: Operational health (PostgreSQL and CLI)
        run: cargo test --locked --no-default-features --test production_health --test health_cli
      - name: Network chaos (real PostgreSQL via loopback fault proxy)
        run: cargo test --locked --no-default-features --test postgres_network_chaos -- --test-threads=1
      - name: PostgreSQL HA probe (independent processes, isolated CI)
        run: cargo test --locked --no-default-features --features ha-probe --test ha_probe_cli --bin ocaf-ha-probe -- --test-threads=1
      - name: HA probe Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features ha-probe -- -D warnings
      - name: TLS 1.3 verified peer certificate to RPC sender binding (real handshake)
        run: cargo test --locked --features tls-bound --test tls_bound_identity
      - name: TLS-bound Clippy (all targets)
        run: cargo clippy --locked --features tls-bound --all-targets -- -D warnings
      - name: Tests (Zenoh)
        run: cargo test --locked
      - name: Transport chaos (Zenoh and PostgreSQL takeover)
        run: cargo test --locked --test zenoh_chaos_takeover -- --test-threads=1
      - name: Clippy (full Zenoh)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: All-features Clippy contract gate (0.38)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
