# Temporary, path-scoped bootstrap job. Remove after Cargo.lock is committed.
name: Lockfile Bootstrap
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/lockfile-bootstrap.yml"]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and validate lockfile
        run: |
          set -euo pipefail
          test ! -e Cargo.lock
          cargo generate-lockfile
          cargo metadata --format-version 1 --locked --no-deps > /dev/null
          test -s Cargo.lock
      - name: Commit lockfile on main (fast-forward only)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Cargo.lock
          git commit -m "build(deps): commit resolved Rust dependency lockfile"
          git push origin HEAD:main
