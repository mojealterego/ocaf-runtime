name: OMAt Rust artifact validator (manual diagnostics)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Unit-test Rust OMAt validator
        run: cargo test --manifest-path omat/ocaf-artifact-gate/Cargo.toml
      - name: Diagnostic structural check (not release certification)
        run: cargo run --manifest-path omat/ocaf-artifact-gate/Cargo.toml -- check-tree .
      - name: Build and test standalone registered artifact crates
        shell: bash
        run: |
          set -euo pipefail
          for namespace in agents agent_systems swarms omat omas; do
            test -d "$namespace" || continue
            for unit in "$namespace"/*; do
              test -d "$unit/Cargo.toml" || continue
              cargo test --manifest-path "$unit/Cargo.toml"
            done
          done
