name: OCAF Rust artifact structural admission
on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "agent_systems/**"
      - "swarms/**"
      - "omat/**"
      - "omas/**"
      - ".github/workflows/ocaf-artifact-admission.yml"
  pull_request:
    paths:
      - "agents/**"
      - "agent_systems/**"
      - "swarms/**"
      - "omat/**"
      - "omas/**"
      - ".github/workflows/ocaf-artifact-admission.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Verify Rust gate itself
        run: cargo test --manifest-path omat/ocaf-artifact-gate/Cargo.toml
      - name: Reject Markdown-only and missing Rust artifact directories
        run: cargo run --manifest-path omat/ocaf-artifact-gate/Cargo.toml -- check-tree .
      - name: Build and test every registered Rust artifact
        shell: bash
        run: |
          set -euo pipefail
          for namespace in agents agent_systems swarms omat omas; do
            test -d "$namespace" || continue
            for unit in "$namespace"/*; do
              test -d "$unit" || continue
              cargo test --manifest-path "$unit/Cargo.toml"
            done
          done
