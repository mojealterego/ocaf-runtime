name: OCAF 0.39 REAL independent Linux host Firecracker fault pair (CI only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage039-independent-hosts.yml
      - scripts/stage039_independent_hosts.py
      - scripts/stage039_live_firecracker.py
      - scripts/stage039_vm_crash.py
      - scripts/stage039_vm_resources.py
      - scripts/stage039_firecracker_spec.py
      - scripts/stage039_kvm_ioctl.py
      - scripts/tests/test_stage039_independent_hosts.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-independent-linux-host:
    name: Actual separate Linux KVM host - ${{ matrix.tenant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - tenant: tenant-a
            agent: agent-a
            uid: 1002
          - tenant: tenant-b
            agent: agent-b
            uid: 1003
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Real KVM_CREATE_VM and host boot-id on separate machine
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "stage039-independent-evidence"
          sudo -n python3 scripts/stage039_kvm_ioctl.py --report stage039-independent-evidence/kvm.json
          sudo -n chown "$(id -u):$(id -g)" stage039-independent-evidence/kvm.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("stage039-independent-evidence/kvm.json").read_text())
          assert report["kvm_vm_fd_created"] is True
          assert report["status"] == "KVM_IOCTL_VM_CREATED_NOT_BOOTED"
          print("OCAF039_SEPARATE_HOST_KVM_CREATE_VM_PROVED")
          PY
          printf 'OCAF039_HOST_BOOT_ID=%s\n' "$(cat /proc/sys/kernel/random/boot_id)"
      - name: Download and checksum-persist official Firecracker v1.17 Linux guest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/ocaf039-independent-source
          cd /tmp/ocaf039-independent-source
          curl --fail --silent --show-error --location --retry 2 --max-time 120 --proto '=https' --tlsv1.2 \
            https://github.com/firecracker-microvm/firecracker/releases/download/v1.17.0/firecracker-v1.17.0-x86_64.tgz \
            -o firecracker-v1.17.0-x86_64.tgz
          echo '06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558  firecracker-v1.17.0-x86_64.tgz' | sha256sum --check -
          tar -xzf firecracker-v1.17.0-x86_64.tgz
          curl --fail --silent --show-error --location --retry 2 --max-time 120 --proto '=https' --tlsv1.2 \
            https://s3.amazonaws.com/spec.ccfc.min/img/hello/kernel/hello-vmlinux.bin -o hello-vmlinux.bin
          curl --fail --silent --show-error --location --retry 2 --max-time 120 --proto '=https' --tlsv1.2 \
            https://s3.amazonaws.com/spec.ccfc.min/img/hello/fsfiles/hello-rootfs.ext4 -o hello-rootfs.ext4
          echo '882fa465c43ab7d92e31bd4167da3ad6a82cb9230f9b0016176df597c6014cef  hello-vmlinux.bin' | sha256sum --check -
          echo '786f0612582cadcee4c8ad46e30e4cc93dff9a3c0b4ede3f3c597b4c241dd547  hello-rootfs.ext4' | sha256sum --check -
      - name: Construct separately provisioned root-owned tenant image registry
        shell: bash
        env:
          TENANT: ${{ matrix.tenant }}
          AGENT: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          umask 077
          PREFIX="/opt/o39h${GITHUB_RUN_ID}-${TENANT#tenant-}"
          SRC="/tmp/ocaf039-independent-source"
          sudo -n install -d -o root -g root -m 0700 "$PREFIX" "$PREFIX/approved" "$PREFIX/jailer"
          sudo -n install -o root -g root -m 0555 "$SRC/release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64" "$PREFIX/approved/firecracker"
          sudo -n install -o root -g root -m 0555 "$SRC/release-v1.17.0-x86_64/jailer-v1.17.0-x86_64" "$PREFIX/approved/jailer"
          sudo -n install -o root -g root -m 0444 "$SRC/hello-vmlinux.bin" "$PREFIX/approved/guest_kernel"
          sudo -n install -o root -g root -m 0444 "$SRC/hello-rootfs.ext4" "$PREFIX/approved/guest_rootfs"
          sudo -n install -o root -g root -m 0444 "$GITHUB_WORKSPACE/stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf" "$PREFIX/approved/aya_cgroup_device"
          sudo -n python3 - "$PREFIX" "$TENANT" "$AGENT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          base=Path(sys.argv[1])/"approved"
          def artifact(name):
              p=base/name
              return {"path":str(p),"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          assets={name:artifact(name) for name in
                  ("firecracker","guest_kernel","guest_rootfs","aya_cgroup_device")}
          pins={"guest_kernel":"882fa465c43ab7d92e31bd4167da3ad6a82cb9230f9b0016176df597c6014cef",
                "guest_rootfs":"786f0612582cadcee4c8ad46e30e4cc93dff9a3c0b4ede3f3c597b4c241dd547",
                "aya_cgroup_device":"992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95"}
          assert all(assets[k]["sha256"]==v for k,v in pins.items())
          request={"schema_version":1,"workload_id":"ocaf-independent-"+sys.argv[2],
              "tenant_id":sys.argv[2],"agent_id":sys.argv[3],
              "isolation":{"hypervisor":"firecracker","jailer":True,
                  "network":"none","guest_egress":False,"rootfs_readonly":True,
                  "mmds_enabled":False,"seccomp":"default","vcpus":1,"mem_mib":256},
              "assets":assets}
          out=base/"request.json"
          out.write_text(json.dumps(request,sort_keys=True)+"\n")
          out.chmod(0o600)
          print("STAGE039_INDEPENDENT_HOST_PINNED_MANIFEST_READY")
          PY
      - name: Actual jailed guest kernel boot and SIGKILL cgroup drain on own host
        shell: bash
        env:
          TENANT: ${{ matrix.tenant }}
          VM_UID: ${{ matrix.uid }}
        run: |
          set -euo pipefail
          PREFIX="/opt/o39h${GITHUB_RUN_ID}-${TENANT#tenant-}"
          FC="$PREFIX/approved/firecracker"
          JAILER="$PREFIX/approved/jailer"
          sudo -n python3 scripts/stage039_live_firecracker.py \
            --manifest "$PREFIX/approved/request.json" --approved-root "$PREFIX/approved" \
            --firecracker "$FC" --firecracker-sha256 "$(sudo -n sha256sum "$FC" | cut -d ' ' -f 1)" \
            --jailer "$JAILER" --jailer-sha256 "$(sudo -n sha256sum "$JAILER" | cut -d ' ' -f 1)" \
            --chroot-base "$PREFIX/jailer" --uid "$VM_UID" --gid "$VM_UID" \
            --timeout 70 --ack-vm-sigkill-fault \
            --report "stage039-independent-evidence/guest.json" \
            --ack-real-kvm-jailer-boot
          sudo -n chown "$(id -u):$(id -g)" stage039-independent-evidence/guest.json
          python3 - "$TENANT" <<'PY'
          import json,socket,sys
          from pathlib import Path
          tenant=sys.argv[1]
          report=json.loads(Path("stage039-independent-evidence/guest.json").read_text())
          assert report["tenant_id"]==tenant
          assert report["firecracker_api_running"] is True
          assert report["guest_kernel_console_seen"] is True
          assert report["vm_sigkill_fault"]["status"]=="VM_SIGKILL_CGROUP_SUBTREE_DRAINED"
          assert report["vm_sigkill_fault"]["cgroup_subtree_empty"] is True
          assert report["vm_sigkill_fault"]["sigkill_exit_code"]==-9
          assert report["production_approved"] is False
          host={"tenant_id":tenant,"host_boot_id":report["host_boot_id"],
                "hostname":socket.gethostname(),"guest":report}
          Path("stage039-independent-evidence/host-"+tenant+".json").write_text(
              json.dumps(host,sort_keys=True,indent=2)+"\n")
          print("STAGE039_REAL_INDEPENDENT_LINUX_HOST_GUEST_SIGKILL_PROVED",tenant)
          PY
      - name: Diagnose failure using bounded public demo guest serial console
        if: failure()
        shell: bash
        env:
          TENANT: ${{ matrix.tenant }}
        run: |
          set -euo pipefail
          PREFIX="/opt/o39h${GITHUB_RUN_ID}-${TENANT#tenant-}"
          echo "OCAF039_INDEPENDENT_JAILER_FAILURE_DIAGNOSTICS"
          sudo -n find "$PREFIX/jailer" -maxdepth 8 -type f -name serial-console.log \
            -exec tail -n 70 '{}' ';' || true
          sudo -n find "$PREFIX/jailer" -maxdepth 5 -type f -name firecracker.socket -print || true
          sudo -n find "$PREFIX/jailer" -maxdepth 5 -type d -print || true
      - name: Preserve separate real machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocaf039-independent-${{ matrix.tenant }}
          path: stage039-independent-evidence/
          retention-days: 30
          if-no-files-found: warn

  compare-real-independent-hosts:
    name: Reject same host, missing VM SIGKILL or forged host identity
    needs: [real-independent-linux-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Independently test fail-closed host acceptance contract
        run: python3 -m unittest discover -s scripts/tests -p test_stage039_independent_hosts.py -v
      - name: Fetch immutable independent runner A evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ocaf039-independent-tenant-a
          path: /tmp/ocaf039-independent-a
      - name: Fetch immutable independent runner B evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ocaf039-independent-tenant-b
          path: /tmp/ocaf039-independent-b
      - name: Require two genuine distinct Linux boots and full guest fault evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage039-independent-comparison
          python3 scripts/stage039_independent_hosts.py \
            --tenant-a /tmp/ocaf039-independent-a/host-tenant-a.json \
            --tenant-b /tmp/ocaf039-independent-b/host-tenant-b.json \
            --report stage039-independent-comparison/independent-hosts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("stage039-independent-comparison/independent-hosts.json").read_text())
          assert p["status"]=="TWO_INDEPENDENT_EPHEMERAL_KERNEL_HOST_KVM_SIGKILL_PROVED"
          assert p["two_separate_kernel_boot_ids_observed"] is True
          assert p["two_separate_guest_kernels_booted"] is True
          assert p["two_independent_vm_sigkill_and_cgroup_drain_tests"] is True
          assert p["both_running_vm_rootfs_fd_inodes_match_pinned_images"] is True
          assert p["durable_production_host_independence_proved"] is False
          assert p["interhost_rpc_tested"] is False
          assert p["production_approved"] is False
          print("STAGE039_TWO_REAL_DISTINCT_KERNEL_HOST_GUEST_BOOT_AND_SIGKILL_PROVED")
          PY
      - name: Preserve final evidence binding two host reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocaf039-independent-comparison
          path: stage039-independent-comparison/
          retention-days: 30
          if-no-files-found: warn
