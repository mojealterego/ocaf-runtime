# One-time, branchless root-owned security migration; commit only if CI passes.
# Security regression: drop YAML decoder from recursive includes too.
# Gate Zenoh-only test target so the --no-default-features core matrix still compiles.
name: Zenoh PEM and YAML Migration
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/zenoh-pem-yaml-migration.yml"]

permissions:
  contents: read

jobs:
  validate-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Acquire vetted crate sources and migrate the three Zenoh components
        run: |
          set -euo pipefail
          cargo fetch --locked
          python3 scripts/migrate_zenoh_tls_yaml.py --repo . --source-home "${CARGO_HOME:-$HOME/.cargo}"
          cargo generate-lockfile
          python3 scripts/supply_chain.py --repo .
          python3 scripts/zenoh_feature_policy.py --repo .
      - name: Regression tests, format and full Clippy
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
          cargo fmt --all -- --check
          cargo test --locked --no-default-features
          cargo test --locked --test zenoh_secure_format --test transport_policy --test zenoh_mtls_e2e --test zenoh_e2e
          cargo clippy --locked --all-targets -- -D warnings
      - name: Dependency regression check — all four advisories removed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages=tomllib.loads(Path("Cargo.lock").read_text())["package"]
          ids={p["name"]:p for p in packages}
          assert ids["lz4_flex"]["version"]=="0.11.6"
          assert ids["pastey"]["version"]=="0.2.3"
          for bad in ("paste","rustls-pemfile","serde_yaml","unsafe-libyaml","rsa"):
              assert bad not in ids, f"disallowed package still present: {bad}"
          for local in ("zenoh-transport","token-cell","zenoh-config","zenoh-link-tls","zenoh-link-commons"):
              assert "source" not in ids[local], f"upstream patch not applied: {local}"
          print("All original four RustSec findings removed from dependency graph")
          PY
      - name: Cargo-deny full-feature third-party security review
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Commit verified migration directly to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zenoh-pem-yaml-migration.yml
          git add Cargo.toml Cargo.lock vendor/zenoh-config vendor/zenoh-link-tls vendor/zenoh-link-commons
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): migrate Zenoh TLS PEM parsing and disable unsafe YAML"
          git push origin HEAD:main
