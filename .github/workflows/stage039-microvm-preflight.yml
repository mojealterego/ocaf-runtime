name: OCAF 0.39 Firecracker-KVM-Aya admission CI (NOT production approval)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage039-microvm-preflight.yml
      - scripts/stage039_microvm_gate.py
      - scripts/tests/test_stage039_microvm_gate.py
      - scripts/stage039_broker_ledger.py
      - scripts/tests/test_stage039_broker_ledger.py
      - scripts/stage039_broker_ipc.py
      - scripts/tests/test_stage039_broker_ipc.py
      - scripts/stage039_kvm_ioctl.py
      - scripts/tests/test_stage039_kvm_ioctl.py
      - stage039/aya-guard/**
      - stage039/aya-ebpf-egress/**
      - scripts/release_readiness.py
      - scripts/tests/test_release_readiness.py
      - ops/OCAF_RELEASE_OPERATOR_DECISION_2026-10-15.json
      - docs/STAGE039_MICROVM_EBPF.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microvm-admission:
    name: Default-deny admission and factual Linux KVM/eBPF host observations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Regression suite - reject privilege escape, tampering and forged approval
        run: python3 -m unittest discover -s scripts/tests -p test_stage039_microvm_gate.py -v
      - name: Verify durable broker admission and leader fencing on real SQLite
        run: python3 -m unittest discover -s scripts/tests -p test_stage039_broker_ledger.py -v
      - name: Verify actual Linux AF_UNIX SO_PEERCRED broker protocol
        run: python3 -m unittest discover -s scripts/tests -p test_stage039_broker_ipc.py -v
      - name: Verify explicit operator release authorization keeps audit failures visible
        run: python3 -m unittest discover -s scripts/tests -p test_release_readiness.py -v
      - name: Exercise explicitly operator-unblocked administrative release, preserving factual blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_readiness.py --repo . \
            --operator-override-policy ops/OCAF_RELEASE_OPERATOR_DECISION_2026-10-15.json \
            --ack-unverified-production-risk > stage039-operator-release-state.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage039-operator-release-state.json").read_text())
          if (r.get("status") != "OPERATOR_AUTHORIZED_UNVERIFIED" or
              r.get("administrative_release_unblocked") is not True or
              r.get("production_approved") is not False or
              r.get("technical_evidence_passed") is not False or
              r.get("deployment_executed") is not False or
              "evidence_manifest_missing" not in r.get("blockers", [])):
              raise SystemExit("operator override must not forge evidence or deployment")
          print("OPERATOR_ADMIN_RELEASE_UNBLOCKED_WITH_UNVERIFIED_EVIDENCE")
          PY
      - name: Kernel KVM API ioctl and real VM fd creation regression
        run: python3 -m unittest discover -s scripts/tests -p test_stage039_kvm_ioctl.py -v
      - name: Compile Aya userspace loader and run local-policy unit tests (NO kernel attachment in CI)
        run: cargo test --manifest-path stage039/aya-guard/Cargo.toml --verbose
      - name: Python source syntax verification
        run: |
          python3 -m py_compile scripts/stage039_microvm_gate.py scripts/tests/test_stage039_microvm_gate.py
          python3 -m py_compile scripts/stage039_broker_ledger.py scripts/tests/test_stage039_broker_ledger.py
          python3 -m py_compile scripts/stage039_broker_ipc.py scripts/tests/test_stage039_broker_ipc.py
          python3 -m py_compile scripts/stage039_kvm_ioctl.py scripts/tests/test_stage039_kvm_ioctl.py
      - name: Observe KVM, cgroup v2, PID1 systemd, BTF and bpffs on actual CI Linux
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/stage039_microvm_gate.py --host-only --report stage039-host-preflight.json
          rc=$?
          set -e
          test "$rc" -eq 0 || test "$rc" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage039-host-preflight.json").read_text())
          expected={'linux_x86_64','systemd_pid1','cgroup_v2_limits_available',
                    'kvm_device_character','kvm_device_accessible',
                    'btf_core_available','bpffs_mounted'}
          if set(r.get('checks', {})) != expected:
              raise SystemExit('incomplete host observation')
          if (r.get('microvm_launched') is not False or
              r.get('ebpf_attached') is not False or
              r.get('stage_039_complete') is not False or
              r.get('production_approved') is not False):
              raise SystemExit('fabricated microVM/eBPF evidence')
          target="HOST_PREREQUISITES_ONLY" if r['passed'] else "NO_GO"
          if r['status'] != target:
              raise SystemExit('host gate failed closed incorrectly')
          print('STAGE039_LINUX_FACTUAL_PREFLIGHT:',r['status'])
          PY
      - name: Actual KVM ioctl VM-create on host if available, truthful NO-GO otherwise
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/stage039_kvm_ioctl.py --report stage039-kvm-ioctl.json
          rc=$?
          set -e
          test "$rc" -eq 0 || test "$rc" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage039-kvm-ioctl.json").read_text())
          if any(r.get(k) is not False for k in (
              "firecracker_booted", "guest_booted", "ebpf_attached",
              "microvm_launched", "production_approved", "stage_039_complete")):
              raise SystemExit("cannot infer actual guest boot from KVM ioctl")
          if r.get("kvm_vm_fd_created") is True:
              if r["status"] != "KVM_IOCTL_VM_CREATED_NOT_BOOTED" or r["api_version_verified"] is not True:
                  raise SystemExit("invalid real ioctl evidence")
          elif r.get("status") != "NO_GO":
              raise SystemExit("missing KVM must remain NO_GO")
          print("STAGE039_ACTUAL_KERNEL_KVM_IOCTL:",r["status"])
          PY
      - name: Preserve read-only stage 0.39 evidence (not guest-VM attestation)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage039-linux-kvm-ebpf-readonly-preflight
          path: |
            stage039-host-preflight.json
            stage039-operator-release-state.json
            stage039-kvm-ioctl.json
          retention-days: 30
          if-no-files-found: warn
