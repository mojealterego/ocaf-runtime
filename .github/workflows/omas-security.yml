name: OMAS signed admission
on:
  push:
    branches: [main]
    paths:
      - 'src/omas_signed.rs'
      - 'src/omas_policy.rs'
      - 'src/runtime/mod.rs'
      - 'src/executor/mod.rs'
      - 'src/executor/wasi.rs'
      - 'src/lib.rs'
      - 'tests/omas_dispatch.rs'
      - 'tests/fixtures/wasi_infinite_loop.wat'
      - 'tests/scripts/verify_wasmtime_fuel_exhaustion.sh'
      - '.github/workflows/omas-security.yml'
  pull_request:
    paths:
      - 'src/omas_signed.rs'
      - 'src/omas_policy.rs'
      - 'src/runtime/mod.rs'
      - 'src/executor/mod.rs'
      - 'src/executor/wasi.rs'
      - 'src/lib.rs'
      - 'tests/omas_dispatch.rs'
      - 'tests/fixtures/wasi_infinite_loop.wat'
      - 'tests/scripts/verify_wasmtime_fuel_exhaustion.sh'
      - '.github/workflows/omas-security.yml'
permissions:
  contents: read
jobs:
  omas-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: OMAS unit and negative tests
        run: cargo test --no-default-features omas -- --nocapture
      - name: Concurrent nonce replay regression
        run: cargo test --no-default-features concurrent_replay_allows_exactly_one_admission -- --nocapture
      - name: OMAS signed operation tests
        run: cargo test --no-default-features signature_binds_operation_and_replay_persists
      - name: Signed dispatch integration test
        run: cargo test --no-default-features --test omas_dispatch
      - name: WASI signed fuel boundary tests
        run: cargo test --no-default-features signed_fuel_never_exceeds_either_ceiling -- --nocapture
      - name: Signed WASI engine regression tests
        run: cargo test --no-default-features pinned_engine_tests -- --nocapture
      - name: Real Wasmtime fuel exhaustion (operator-approved engine)
        if: ${{ vars.OCAF_WASMTIME_BIN != '' }}
        env:
          WASMTIME_BIN: ${{ vars.OCAF_WASMTIME_BIN }}
        run: bash tests/scripts/verify_wasmtime_fuel_exhaustion.sh
      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings
