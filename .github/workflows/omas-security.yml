name: OMAS signed admission
on:
  push:
    branches: [main]
    paths:
      - 'src/omas_signed.rs'
      - 'src/omas_policy.rs'
      - 'src/runtime/mod.rs'
      - 'src/rpc/mod.rs'
      - 'src/jobs/worker.rs'
      - 'src/jobs/remote.rs'
      - 'src/executor/mod.rs'
      - 'src/executor/wasi.rs'
      - 'src/lib.rs'
      - 'tests/omas_dispatch.rs'
      - 'tests/fixtures/wasi_infinite_loop.wat'
      - 'tests/fixtures/wasi_finite_loop.wat'
      - 'tests/scripts/verify_wasmtime_fuel_exhaustion.sh'
      - '.github/workflows/omas-security.yml'
  pull_request:
    paths:
      - 'src/omas_signed.rs'
      - 'src/omas_policy.rs'
      - 'src/runtime/mod.rs'
      - 'src/rpc/mod.rs'
      - 'src/jobs/worker.rs'
      - 'src/jobs/remote.rs'
      - 'src/executor/mod.rs'
      - 'src/executor/wasi.rs'
      - 'src/lib.rs'
      - 'tests/omas_dispatch.rs'
      - 'tests/fixtures/wasi_infinite_loop.wat'
      - 'tests/fixtures/wasi_finite_loop.wat'
      - 'tests/scripts/verify_wasmtime_fuel_exhaustion.sh'
      - '.github/workflows/omas-security.yml'
permissions:
  contents: read
jobs:
  omas-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: OMAS unit and negative tests
        run: cargo test --locked --no-default-features omas -- --nocapture
      - name: Tenant entrypoint, payload and namespace security regressions
        run: cargo test --locked --no-default-features omas_entrypoint_tests -- --nocapture
      - name: Durable nonce replay after SQLite reopen
        run: cargo test --locked --no-default-features replay_remains_rejected_after_database_reopen -- --nocapture
      - name: Concurrent nonce replay regression
        run: cargo test --locked --no-default-features concurrent_replay_allows_exactly_one_admission -- --nocapture
      - name: OMAS signed operation tests
        run: cargo test --locked --no-default-features signature_binds_operation_and_replay_persists
      - name: Signed dispatch integration test
        run: cargo test --locked --no-default-features --test omas_dispatch
      - name: WASI signed fuel boundary tests
        run: cargo test --locked --no-default-features signed_fuel_never_exceeds_either_ceiling -- --nocapture
      - name: Signed WASI engine regression tests
        run: cargo test --locked --no-default-features pinned_engine_tests -- --nocapture
      - name: Validate WASI fuel test shell syntax
        run: bash -n tests/scripts/verify_wasmtime_fuel_exhaustion.sh
      - name: Fetch and verify pinned Wasmtime for real fuel test
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          archive=wasmtime-v49.0.2-x86_64-linux.tar.xz
          mkdir -p "$RUNNER_TEMP/ocaf-wasmtime"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/$archive" \
            -o "$RUNNER_TEMP/ocaf-wasmtime/$archive"
          echo "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  $RUNNER_TEMP/ocaf-wasmtime/$archive" \
            | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/ocaf-wasmtime/$archive" -C "$RUNNER_TEMP/ocaf-wasmtime"
          test -x "$RUNNER_TEMP/ocaf-wasmtime/wasmtime-v49.0.2-x86_64-linux/wasmtime"
      - name: Real Wasmtime fuel exhaustion (required security gate)
        run: |
          set -euo pipefail
          export XDG_CACHE_HOME="$RUNNER_TEMP/ocaf-wasmtime-cache"
          mkdir -p "$XDG_CACHE_HOME"
          export WASMTIME_BIN="$RUNNER_TEMP/ocaf-wasmtime/wasmtime-v49.0.2-x86_64-linux/wasmtime"
          export WASMTIME_SHA256="$(sha256sum "$WASMTIME_BIN" | cut -d ' ' -f 1)"
          bash tests/scripts/verify_wasmtime_fuel_exhaustion.sh
      - name: Clippy
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
