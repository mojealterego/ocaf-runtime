name: OMAS signed admission
on:
  push:
    branches: [main]
    paths:
      - 'src/omas_signed.rs'
      - 'src/omas_policy.rs'
      - 'src/runtime/mod.rs'
      - 'src/rpc/mod.rs'
      - 'src/jobs/worker.rs'
      - 'src/jobs/remote.rs'
      - 'src/executor/mod.rs'
      - 'src/executor/wasi.rs'
      - 'src/lib.rs'
      - 'tests/omas_dispatch.rs'
      - 'tests/fixtures/wasi_infinite_loop.wat'
      - 'tests/fixtures/wasi_finite_loop.wat'
      - 'tests/scripts/verify_wasmtime_fuel_exhaustion.sh'
      - '.github/workflows/omas-security.yml'
  pull_request:
    paths:
      - 'src/omas_signed.rs'
      - 'src/omas_policy.rs'
      - 'src/runtime/mod.rs'
      - 'src/rpc/mod.rs'
      - 'src/jobs/worker.rs'
      - 'src/jobs/remote.rs'
      - 'src/executor/mod.rs'
      - 'src/executor/wasi.rs'
      - 'src/lib.rs'
      - 'tests/omas_dispatch.rs'
      - 'tests/fixtures/wasi_infinite_loop.wat'
      - 'tests/fixtures/wasi_finite_loop.wat'
      - 'tests/scripts/verify_wasmtime_fuel_exhaustion.sh'
      - '.github/workflows/omas-security.yml'
permissions:
  contents: read
jobs:
  omas-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: OMAS unit and negative tests
        run: cargo test --no-default-features omas -- --nocapture
      - name: Tenant entrypoint, payload and namespace security regressions
        run: cargo test --locked --no-default-features omas_entrypoint_tests -- --nocapture
      - name: Durable nonce replay after SQLite reopen
        run: cargo test --locked --no-default-features replay_remains_rejected_after_database_reopen -- --nocapture
      - name: Concurrent nonce replay regression
        run: cargo test --no-default-features concurrent_replay_allows_exactly_one_admission -- --nocapture
      - name: OMAS signed operation tests
        run: cargo test --no-default-features signature_binds_operation_and_replay_persists
      - name: Signed dispatch integration test
        run: cargo test --no-default-features --test omas_dispatch
      - name: WASI signed fuel boundary tests
        run: cargo test --no-default-features signed_fuel_never_exceeds_either_ceiling -- --nocapture
      - name: Signed WASI engine regression tests
        run: cargo test --no-default-features pinned_engine_tests -- --nocapture
      - name: Validate WASI fuel test shell syntax
        run: bash -n tests/scripts/verify_wasmtime_fuel_exhaustion.sh
      - name: Real Wasmtime fuel exhaustion (required security gate)
        env:
          WASMTIME_BIN: ${{ vars.OCAF_WASMTIME_BIN }}
          WASMTIME_SHA256: ${{ vars.OCAF_WASMTIME_SHA256 }}
        run: |
          if [[ -z "$WASMTIME_BIN" || -z "$WASMTIME_SHA256" ]]; then
            echo "::error::Configure OCAF_WASMTIME_BIN and OCAF_WASMTIME_SHA256; fuel exhaustion gate cannot be skipped"
            exit 1
          fi
          bash tests/scripts/verify_wasmtime_fuel_exhaustion.sh
      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings
