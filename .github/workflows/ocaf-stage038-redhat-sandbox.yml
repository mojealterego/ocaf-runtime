name: OCAF 0.38 Red Hat OpenShift Sandbox Read-Only Preflight (NO-GO)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocaf-stage038-redhat-sandbox.yml'
      - 'scripts/openshift_sandbox_audit.py'
      - 'scripts/tests/test_openshift_sandbox_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-inventory:
    name: Read-only project VM/RBAC/quota inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SANDBOX_API_URL: ${{ secrets.OCAF_SANDBOX_API_URL }}
      SANDBOX_API_FALLBACK: ${{ secrets.OCAF_SANDBOX_API }}
      SANDBOX_TOKEN: ${{ secrets.OCAF_SANDBOX_TOKEN }}
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline parser safety tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_openshift_sandbox_audit.py' -v
      - name: Setup namespace-scoped temporary Kubernetes context
        env:
          KUBECONFIG: ${{ runner.temp }}/ocaf-sandbox-kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${SANDBOX_TOKEN}" || ( -z "${SANDBOX_API_URL}" && -z "${SANDBOX_API_FALLBACK}" ) ]]; then
            echo "OpenShift connection not configured; no cluster requests made."
            printf '%s\n' '{"schema_version":1,"status":"CONNECTION_NOT_CONFIGURED","stage_038_complete":false,"production_approved":false}' > stage038-redhat-preflight.json
            exit 1
          fi
          API_SERVER="$(python3 - <<'PY'
          import os, sys, urllib.parse
          expected = "api.rm3.7wse.p1.openshiftapps.com"
          for name in ("SANDBOX_API_URL", "SANDBOX_API_FALLBACK"):
              raw = os.environ.get(name, "").strip()
              try:
                  u = urllib.parse.urlparse(raw)
                  if (u.scheme == "https" and u.hostname == expected and u.port == 6443
                          and not u.username and not u.password
                          and u.path in ("", "/") and not u.query and not u.fragment
                          and not u.params):
                      print(raw.rstrip("/"))
                      sys.exit(0)
              except ValueError:
                  pass
          # Exact namespace cluster API was independently TLS-verified via
          # unauthenticated /version and /readyz on 2026-10-14.
          # Never forward the bearer token to a host taken from untrusted input.
          print("https://api.rm3.7wse.p1.openshiftapps.com:6443")
          PY
          )"
          if [[ ${#SANDBOX_TOKEN} -lt 20 ]]; then
            echo "OpenShift token missing or unexpectedly short."
            exit 1
          fi
          # Fail closed before configuring credentials if the verified Kubernetes
          # API endpoint is unreachable or has an invalid TLS certificate.
          curl --fail --silent --show-error --max-time 15 "${API_SERVER}/version" >/dev/null
          command -v kubectl >/dev/null
          kubectl config set-cluster ocaf-redhat --server="${API_SERVER}" >/dev/null
          kubectl config set-credentials ocaf-readonly --token="${SANDBOX_TOKEN}" >/dev/null
          kubectl config set-context ocaf-redhat --cluster=ocaf-redhat --user=ocaf-readonly --namespace=mojealterego-dev >/dev/null
          kubectl config use-context ocaf-redhat >/dev/null
      - name: Inspect existing namespace without creating resources
        env:
          KUBECONFIG: ${{ runner.temp }}/ocaf-sandbox-kubeconfig
        if: ${{ env.SANDBOX_API_URL != '' && env.SANDBOX_TOKEN != '' }}
        run: python3 scripts/openshift_sandbox_audit.py --report stage038-redhat-preflight.json
      - name: Archive sanitized read-only report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocaf-stage038-redhat-sandbox-readonly
          path: stage038-redhat-preflight.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove ephemeral local Kubernetes credential material
        if: always()
        env:
          KUBECONFIG: ${{ runner.temp }}/ocaf-sandbox-kubeconfig
        shell: bash
        run: rm -f -- "${KUBECONFIG}"
