      - name: Reject signed workload and rootfs tampering before VM admission
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/opt/ocaf039-real-$GITHUB_RUN_ID"
          sudo -n python3 - "$PREFIX" "$GITHUB_WORKSPACE" <<'PY'
          import json,os,sys,tempfile
          from pathlib import Path
          from unittest.mock import patch
          prefix=Path(sys.argv[1]);workspace=Path(sys.argv[2]);approved=prefix/"approved"
          sys.path.insert(0,str(workspace/"scripts"))
          import stage039_broker_vm_binding as binding
          import stage039_microvm_gate as gate
          manifest_a=approved/"request-wasi-a.json"
          manifest_b=approved/"request-wasi-b.json"
          signed_a=approved/"signed-wasi-a.json"
          signed_b=approved/"signed-wasi-b.json"
          key=approved/"stage039-ci-public.key"
          checks={}
          with tempfile.TemporaryDirectory(prefix="ocaf039-deny-",dir=prefix) as directory:
              tmp=Path(directory)
              def admission(*,signed_a_path=signed_a,trusted_key_path=key,ledger_name):
                  return binding.run_with_live_broker(
                      manifest_a=manifest_a,manifest_b=manifest_b,
                      approved_root=approved,ledger_dir=tmp/ledger_name,
                      dual_arguments={},require_guest_wasi=True,
                      signed_manifest_a=signed_a_path,signed_manifest_b=signed_b,
                      trusted_public_key=trusted_key_path)
              changed=json.loads(signed_a.read_text())
              changed["payload"]["tenant_id"]="tenant-b"
              tampered=tmp/"signed-tampered.json"
              tampered.write_text(json.dumps(changed,sort_keys=True)+"\n")
              changed_module=json.loads(signed_a.read_text())
              assert "wasi" in changed_module["payload"]
              changed_module["payload"]["wasi"]["module_sha256"]="0"*64
              tampered_module=tmp/"signed-module-tampered.json"
              tampered_module.write_text(json.dumps(changed_module,sort_keys=True)+"\n")
              wrong_key=tmp/"untrusted-public.key"
              wrong_key.write_bytes(bytes(32))
              with patch.object(binding.dual,"execute",side_effect=AssertionError("VM launch must not happen")):
                  for label,kwargs in (
                      ("signed_payload_tamper",dict(signed_a_path=tampered,ledger_name="tampered-ledger")),
                      ("signed_module_digest_tamper",dict(signed_a_path=tampered_module,ledger_name="module-ledger")),
                      ("untrusted_signer",dict(trusted_key_path=wrong_key,ledger_name="untrusted-ledger")),
                  ):
                      try:
                          admission(**kwargs)
                      except binding.BindingError as exc:
                          checks[label]={"denied":True,"reason":str(exc),
                                         "before_ledger":not (tmp/kwargs["ledger_name"]).exists()}
                      else:
                          raise AssertionError(label+" was admitted")
              assert all(item["before_ledger"] for item in checks.values())
          # The original signed manifest pins the actual guest image. Flip a
          # byte, require the gate to reject it, then restore and reverify.
          manifest=manifest_a.read_bytes()
          image=Path(gate.parse_manifest(manifest)["assets"]["guest_rootfs"]["path"])
          expected=gate.parse_manifest(manifest)["assets"]["guest_rootfs"]["sha256"]
          assert image.parent==approved
          assert gate.inspect_manifest(manifest,approved)["artifact_sha256"]["guest_rootfs"]==expected
          fd=os.open(image,os.O_RDWR|os.O_CLOEXEC)
          original=os.pread(fd,1,4096)
          assert len(original)==1
          try:
              assert os.pwrite(fd,bytes([original[0]^1]),4096)==1
              os.fsync(fd)
              try:
                  gate.inspect_manifest(manifest,approved)
              except ValueError as exc:
                  assert "digest mismatch" in str(exc)
                  checks["guest_image_byte_tamper"]={"denied":True,"reason":str(exc)}
              else:
                  raise AssertionError("mutated signed guest image passed admission gate")
          finally:
              os.pwrite(fd,original,4096)
              os.fsync(fd)
              os.close(fd)
          assert gate.inspect_manifest(manifest,approved)["artifact_sha256"]["guest_rootfs"]==expected
          report=workspace/"stage039-real-guest-evidence"/"pre-admission-deny.json"
          report.write_text(json.dumps({"status":"PRE_ADMISSION_NEGATIVE_TESTS_PASSED",
                                        "checks":checks,"vm_launched_during_negative_tests":False,
                                        "production_approved":False,"stage_039_complete":False},
                                       sort_keys=True,indent=2)+"\n")
          print("STAGE039_SIGNED_MANIFEST_AND_IMAGE_TAMPER_PRE_ADMISSION_DENIED")
          PY
