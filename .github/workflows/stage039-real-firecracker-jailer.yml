          import base64,json,sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          sys.path.insert(0,"scripts")
          from stage039_signed_manifest import canonical_payload
          root=Path(sys.argv[1]);key=Ed25519PrivateKey.generate()
          public=key.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          trusted=root/"stage039-ci-public.key"
          trusted.write_bytes(public);trusted.chmod(0o400)
          for tenant in ("a","b"):
              payload=json.loads((root/f"request-wasi-{tenant}.json").read_text())
              signature=key.sign(canonical_payload(payload))
              envelope={"key_id":"stage039-ci","public_key":base64.b64encode(public).decode(),
                        "signature":base64.b64encode(signature).decode(),"payload":payload}
              path=root/f"signed-wasi-{tenant}.json"
              path.write_text(json.dumps(envelope,sort_keys=True)+"\n");path.chmod(0o400)
          print("STAGE039_EPHEMERAL_LAB_SIGNER_PREPARED")
          PY
          sudo -n sha256sum "$PREFIX/approved/guest_rootfs_wasi_a" "$PREFIX/approved/guest_rootfs_wasi_b"
