name: OCAF 0.39 REAL KVM Firecracker v1.17 jailed Linux guest boot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage039-real-firecracker-jailer.yml
      - scripts/stage039_live_firecracker.py
      - scripts/stage039_vm_egress.py
      - scripts/stage039_vm_resources.py
      - scripts/stage039_vm_crash.py
      - scripts/stage039_dual_tenant.py
      - scripts/tests/test_stage039_dual_tenant.py
      - scripts/stage039_live_egress.py
      - scripts/tests/test_stage039_vm_egress.py
      - stage039/aya-guard/**
      - stage039/aya-ebpf-egress/prebuilt/**
      - scripts/stage039_firecracker_spec.py
      - scripts/stage039_kvm_ioctl.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-jailer-kvm-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Real kernel KVM_CREATE_VM as privileged root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage039-real-guest-evidence
          sudo -n python3 scripts/stage039_kvm_ioctl.py --report stage039-real-guest-evidence/kvm.json
          sudo -n chown "$(id -u):$(id -g)" stage039-real-guest-evidence/kvm.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage039-real-guest-evidence/kvm.json").read_text())
          assert r["kvm_vm_fd_created"] is True
          assert r["status"]=="KVM_IOCTL_VM_CREATED_NOT_BOOTED"
          print("STAGE039_REAL_KVM_KERNEL_CREATE_VM_PROVED")
          PY
      - name: Fetch official digest-pinned Firecracker, kernel and rootfs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/ocaf039-real-guest-source
          cd /tmp/ocaf039-real-guest-source
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            https://github.com/firecracker-microvm/firecracker/releases/download/v1.17.0/firecracker-v1.17.0-x86_64.tgz \
            -o firecracker-v1.17.0-x86_64.tgz
          echo '06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558  firecracker-v1.17.0-x86_64.tgz' | sha256sum --check -
          tar -xzf firecracker-v1.17.0-x86_64.tgz
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            https://s3.amazonaws.com/spec.ccfc.min/img/hello/kernel/hello-vmlinux.bin -o hello-vmlinux.bin
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            https://s3.amazonaws.com/spec.ccfc.min/img/hello/fsfiles/hello-rootfs.ext4 -o hello-rootfs.ext4
          echo '882fa465c43ab7d92e31bd4167da3ad6a82cb9230f9b0016176df597c6014cef  hello-vmlinux.bin' | sha256sum --check -
          echo '786f0612582cadcee4c8ad46e30e4cc93dff9a3c0b4ede3f3c597b4c241dd547  hello-rootfs.ext4' | sha256sum --check -
          file hello-vmlinux.bin hello-rootfs.ext4
      - name: Construct bounded root-owned image registry and signed digest contract
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          SOURCES="/tmp/ocaf039-real-guest-source"
          sudo -n install -d -o root -g root -m 0700 "$PREFIX" "$PREFIX/approved" "$PREFIX/jailer"
          sudo -n chown root:root "$PREFIX" "$PREFIX/approved" "$PREFIX/jailer"
          sudo -n chmod 0700 "$PREFIX" "$PREFIX/approved" "$PREFIX/jailer"
          sudo -n stat -c 'OCAF039_JAILER_DIR %n %a %U:%G' "$PREFIX" "$PREFIX/approved" "$PREFIX/jailer"
          sudo -n install -o root -g root -m 0555 \
            "$SOURCES/release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64" "$PREFIX/approved/firecracker"
          sudo -n install -o root -g root -m 0555 \
            "$SOURCES/release-v1.17.0-x86_64/jailer-v1.17.0-x86_64" "$PREFIX/approved/jailer"
          sudo -n install -o root -g root -m 0444 \
            "$SOURCES/hello-vmlinux.bin" "$PREFIX/approved/guest_kernel"
          sudo -n install -o root -g root -m 0444 \
            "$SOURCES/hello-rootfs.ext4" "$PREFIX/approved/guest_rootfs"
          sudo -n install -o root -g root -m 0444 \
            "$GITHUB_WORKSPACE/stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf" \
            "$PREFIX/approved/aya_cgroup_device"
          sudo -n python3 - "$PREFIX" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          approved=Path(sys.argv[1])/"approved"
          def asset(name):
              file=approved/name
              return {"path":str(file),"sha256":hashlib.sha256(file.read_bytes()).hexdigest()}
          assets={key:asset(key) for key in
                  ("firecracker","guest_kernel","guest_rootfs","aya_cgroup_device")}
          pins={"guest_kernel":"882fa465c43ab7d92e31bd4167da3ad6a82cb9230f9b0016176df597c6014cef",
                "guest_rootfs":"786f0612582cadcee4c8ad46e30e4cc93dff9a3c0b4ede3f3c597b4c241dd547",
                "aya_cgroup_device":"992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95"}
          assert all(assets[k]["sha256"]==v for k,v in pins.items())
          request={"schema_version":1,"workload_id":"ocaf-fc-live-boot",
                   "tenant_id":"tenant-a","agent_id":"agent-a",
                   "isolation":{"hypervisor":"firecracker","jailer":True,
                                "network":"none","guest_egress":False,
                                "rootfs_readonly":True,"mmds_enabled":False,
                                "seccomp":"default","vcpus":1,"mem_mib":256},
                   "assets":assets}
          (approved/"request.json").write_text(json.dumps(request,sort_keys=True)+"\n")
          (approved/"request.json").chmod(0o600)
          print("STAGE039_PINNED_ASSETS_MANIFEST_READY")
          PY
          sudo -n sha256sum "$PREFIX/approved/firecracker" "$PREFIX/approved/jailer" \
            > stage039-real-guest-evidence/verified-vmm-binaries.sha256
          sudo -n chown "$(id -u):$(id -g)" stage039-real-guest-evidence/verified-vmm-binaries.sha256
      - name: Compile pinned Aya loader and provision dedicated root-owned probe
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --manifest-path stage039/aya-guard/Cargo.toml --release
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          sudo -n install -o root -g root -m 0500 \
            stage039/aya-guard/target/release/ocaf-stage039-aya-guard \
            "$PREFIX/approved/aya-guard"
          echo '992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95  stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf' | sha256sum --check -
          echo '992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95  '
          sudo -n sha256sum "$PREFIX/approved/aya-guard" "$PREFIX/approved/aya_cgroup_device" \
            > stage039-real-guest-evidence/verified-aya-binaries.sha256
          sudo -n chown "$(id -u):$(id -g)" stage039-real-guest-evidence/verified-aya-binaries.sha256
      - name: ACTUAL root-privileged Firecracker jailer launches guest Linux on kernel KVM
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          FC="$PREFIX/approved/firecracker"
          JAILER="$PREFIX/approved/jailer"
          sudo -n python3 - "$PREFIX/jailer" <<'PY'
          import os,sys,stat
          from pathlib import Path
          p=Path(sys.argv[1]); st=p.stat()
          print("JAILER_BASE_PYTHON_INSPECTION",dict(path=str(p),
              is_absolute=p.is_absolute(),is_symlink=p.is_symlink(),
              is_dir=p.is_dir(),uid=st.st_uid,mode=oct(stat.S_IMODE(st.st_mode)),
              group_or_world_bits=oct(st.st_mode & 0o077),effective_uid=os.geteuid()))
          import sys
          sys.path.insert(0,"scripts")
          from stage039_live_firecracker import _private_base
          _private_base(p)
          print("JAILER_BASE_PYTHON_PREFLIGHT_PASSED")
          PY
          sudo -n python3 scripts/stage039_live_firecracker.py \
            --manifest "$PREFIX/approved/request.json" --approved-root "$PREFIX/approved" \
            --firecracker "$FC" \
            --firecracker-sha256 "$(sudo -n sha256sum "$FC" | cut -d ' ' -f 1)" \
            --jailer "$JAILER" \
            --jailer-sha256 "$(sudo -n sha256sum "$JAILER" | cut -d ' ' -f 1)" \
            --chroot-base "$PREFIX/jailer" --uid 1002 --gid 1002 \
            --timeout 90 --report stage039-real-guest-evidence/guest-boot.json \
            --aya-loader "$PREFIX/approved/aya-guard" \
            --aya-loader-sha256 "$(sudo -n sha256sum "$PREFIX/approved/aya-guard" | cut -d ' ' -f 1)" \
            --aya-program "$PREFIX/approved/aya_cgroup_device" \
            --aya-program-sha256 992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95 \
            --aya-seconds 15 --ack-privileged-vm-cgroup-egress-probe \
            --ack-vm-sigkill-fault \
            --ack-real-kvm-jailer-boot
          sudo -n chown "$(id -u):$(id -g)" stage039-real-guest-evidence/guest-boot.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          boot=json.loads(Path("stage039-real-guest-evidence/guest-boot.json").read_text())
          for name in ("firecracker_api_running","guest_kernel_console_seen","process_in_expected_cgroup"):
              assert boot[name] is True,name
          assert boot["status"]=="JAILED_FIRECRACKER_GUEST_KERNEL_BOOT_OBSERVED"
          assert boot["ebpf_attached"] is False
          assert boot["production_approved"] is False
          egress=boot["vm_host_cgroup_egress"]
          assert egress["status"]=="VM_HOST_CGROUP_EBPF_PROBE_PASSED"
          assert egress["host_vm_cgroup_egress_enforced"] is True
          assert egress["other_cgroup_remained_reachable"] is True
          assert egress["network_recovered_after_detach"] is True
          assert egress["aya_detached"] is True
          assert egress["guest_network_egress_tested"] is False
          assert egress["production_approved"] is False
          resources=boot["vm_resource_limits"]
          assert resources["status"]=="KERNEL_VM_CGROUP_LIMITS_ENFORCED"
          assert resources["kernel_limits"]["memory.swap.max"]=="0"
          assert resources["kernel_limits"]["memory.oom.group"]=="1"
          assert int(resources["kernel_limits"]["memory.max"])>0
          assert int(resources["kernel_limits"]["pids.max"])==96
          assert resources["observed_memory_peak_bytes"]>0
          assert resources["observed_pids_peak"]>0
          assert resources["kernel_oom_count"]==0
          assert resources["kernel_oom_kill_count"]==0
          assert resources["kernel_pids_quota_hits"]==0
          assert resources["vm_cgroup_inode"]==egress["vm_cgroup_inode"]
          assert resources["production_approved"] is False
          killed=boot["vm_sigkill_fault"]
          assert killed["status"]=="VM_SIGKILL_CGROUP_SUBTREE_DRAINED"
          assert killed["cgroup_subtree_empty"] is True
          assert killed["sigkill_executed"] is True
          assert killed["sigkill_exit_code"]==-9
          assert killed["vm_cgroup_inode"]==resources["vm_cgroup_inode"]
          assert killed["multi_host_failover_tested"] is False
          assert killed["production_approved"] is False
          print("STAGE039_REAL_FIRECRACKER_JAILER_GUEST_LINUX_BOOT_PROVED")
          print("STAGE039_REAL_VM_SIGKILL_CGROUP_REAP_PROVED")
          print("STAGE039_LIVE_KERNEL_CGROUP_RESOURCE_LIMITS_AND_PEAKS_PROVED")
          print("STAGE039_LIVE_VM_HOST_CGROUP_AYA_EGRESS_NEGATIVE_AND_RECOVERY_PROVED")
          PY
      - name: ACTUAL two simultaneous jailed KVM guest kernels - tenant A and B crash isolation
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          mkdir -p stage039-real-guest-evidence
          sudo -n python3 - "$PREFIX/approved/request.json" "$PREFIX/approved/request-b.json" <<'PY'
          import json,sys
          from pathlib import Path
          a=json.loads(Path(sys.argv[1]).read_text())
          a["tenant_id"]="tenant-b"
          a["agent_id"]="agent-b"
          a["workload_id"]="ocaf-fc-live-boot-b"
          p=Path(sys.argv[2]); p.write_text(json.dumps(a,sort_keys=True)+"\n")
          p.chmod(0o600)
          print("STAGE039_DISTINCT_SECOND_TENANT_MANIFEST_PINNED")
          PY
          sudo -n python3 scripts/stage039_dual_tenant.py \
            --manifest-a "$PREFIX/approved/request.json" \
            --manifest-b "$PREFIX/approved/request-b.json" \
            --approved-root "$PREFIX/approved" \
            --firecracker "$PREFIX/approved/firecracker" \
            --firecracker-sha256 "$(sudo -n sha256sum "$PREFIX/approved/firecracker" | cut -d ' ' -f 1)" \
            --jailer "$PREFIX/approved/jailer" \
            --jailer-sha256 "$(sudo -n sha256sum "$PREFIX/approved/jailer" | cut -d ' ' -f 1)" \
            --chroot-base "$PREFIX/jailer" \
            --aya-loader "$PREFIX/approved/aya-guard" \
            --aya-loader-sha256 "$(sudo -n sha256sum "$PREFIX/approved/aya-guard" | cut -d ' ' -f 1)" \
            --aya-program "$PREFIX/approved/aya_cgroup_device" \
            --aya-program-sha256 992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95 \
            --aya-seconds 15 --timeout 90 \
            --report stage039-real-guest-evidence/dual-tenants.json \
            --ack-two-tenant-kvm-sigkill
          sudo -n chown "$(id -u):$(id -g)" stage039-real-guest-evidence/dual-tenants.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage039-real-guest-evidence/dual-tenants.json").read_text())
          assert r["status"]=="TWO_CONCURRENT_TENANTS_VM_BOOT_AND_FAULT_ISOLATION_PASSED"
          assert r["simultaneous_guest_boot"]["two_guests_simultaneously_running"] is True
          assert r["fault_isolation"]["tenant_b_survived_tenant_a_sigkill"] is True
          assert r["tenant_a"]["tenant_id"]=="tenant-a"
          assert r["tenant_b"]["tenant_id"]=="tenant-b"
          assert r["tenant_a"]["cgroup_inode"]!=r["tenant_b"]["cgroup_inode"]
          assert r["tenant_a"]["vm_id"]!=r["tenant_b"]["vm_id"]
          assert r["tenant_a"]["vm_sigkill_fault"]["cgroup_subtree_empty"]
          assert r["tenant_b"]["vm_sigkill_fault"]["cgroup_subtree_empty"]
          assert r["two_independent_hosts"] is False
          assert r["guest_network_egress_tested"] is False
          assert r["production_approved"] is False
          print("STAGE039_REAL_TWO_SIMULTANEOUS_JAILED_FIRECRACKER_TENANTS_PROVED")
          print("STAGE039_TENANT_B_SURVIVED_TENANT_A_SIGKILL_PROVED")
          PY
      - name: Diagnose sandbox failure using only official public guest image boot logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          echo "OCAF039_JAILER_FAILURE_DIAGNOSTIC_BEGIN"
          sudo -n find "$PREFIX/jailer" -maxdepth 7 -name serial-console.log -type f \
            -exec tail -n 100 '{}' ';' || true
          sudo -n find "$PREFIX/jailer" -maxdepth 5 -type f -name 'firecracker*' -print || true
          echo "OCAF039_JAILER_FAILURE_DIAGNOSTIC_END"
      - name: Preserve actual KVM boot and negative/error evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage039-real-firecracker-jailer-linux-evidence
          path: stage039-real-guest-evidence/
          retention-days: 30
          if-no-files-found: warn
