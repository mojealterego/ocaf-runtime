name: OCAF 0.40 REAL PostgreSQL TCP WAL streaming and kernel route partition across THREE netns

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage040-real-postgres-netns.yml
      - scripts/stage040_postgres_netns.py
      - scripts/tests/test_stage040_postgres_netns.py
      - scripts/tests/test_stage040_postgres_netns_soak.py
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Duration of one-kernel PostgreSQL partition load (seconds)"
        type: choice
        options: ["20", "3600"]
        default: "20"

permissions:
  contents: read

jobs:
  actual-postgres-tcp-netns:
    name: Real 3 netns isolated TCP PostgreSQL clusters / B partition / C promotion following
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SOAK_SECONDS: ${{ inputs.soak_seconds || '20' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Strict kernel TCP/host-scope negative unit tests
        run: python3 -m unittest discover -s scripts/tests -p test_stage040_postgres_netns.py -v
      - name: Verify actual pgbench partition, WAL exclusion and recovery negative contracts
        run: python3 -m unittest discover -s scripts/tests -p test_stage040_postgres_netns_soak.py -v
      - name: Ensure actual PostgreSQL 16 server and privileged iproute2 network namespace capabilities
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/16/bin/pg_basebackup; then
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          test -x /usr/lib/postgresql/16/bin/pgbench
          command -v ip
          sudo -n true
      - name: Three real isolated kernel netns PostgreSQL TCP WAL replication, blackhole B and promote
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p stage040-netns-evidence
          sudo -n python3 scripts/stage040_postgres_netns.py \
            --pg-bin-dir /usr/lib/postgresql/16/bin \
            --soak-seconds "$SOAK_SECONDS" \
            --report "$GITHUB_WORKSPACE/stage040-netns-evidence/actual-tcp-wal-netns.json" \
            --ack-privileged-isolated-netns-postgres-fault-lab
          sudo -n chown "$(id -u):$(id -g)" stage040-netns-evidence/actual-tcp-wal-netns.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("stage040-netns-evidence/actual-tcp-wal-netns.json").read_text())
          assert r["status"]=="POSTGRES_THREE_NETNS_TCP_STREAM_PARTITION_RECOVERY_PASSED"
          assert len(set(r["netns_inodes"].values()))==3
          assert r["standby_tcp_client_ips"]==["10.247.40.2","10.247.40.3"]
          assert r["standby_after_promotion_tcp_ip"]=="10.247.40.3"
          assert r["kernel_route_blackhole_b_to_a_installed"] is True
          assert r["partitioned_b_stale_while_c_updated"] is True
          assert r["b_recovered_after_network_heal"] is True
          assert r["standby_c_replayed_after_b_promotion"] is True
          assert r["one_underlying_linux_kernel"] is True
          assert r["inter_kernel_tcp_streaming_tested"] is False
          assert r["production_approved"] is False
          soak=r["pgbench_chaos_soak"]
          assert soak["real_pgbench_completed"] is True
          assert soak["clients"]==8 and soak["duration_seconds"]==int(os.environ["SOAK_SECONDS"])
          assert soak["actual_committed_transactions"]>=100
          assert soak["both_replica_tcp_streams_replayed_commits"] is True
          assert soak["bidirectional_kernel_route_blackhole_verified"] is True
          assert soak["replica_b_isolated_while_c_healthy"] is True
          assert len(soak["account_balances_md5"])==32
          assert soak["actual_pgbench_tps"]>0
          assert soak["inter_kernel_streaming_proved"] is False
          print("STAGE040_REAL_8CLIENT_TCP_PARTITION_PGBENCH_STANDBY_PARITY_PROVED")
          print("STAGE040_ACTUAL_THREE_POSTGRESQL_KERNEL_NETNS_TCP_WAL_PARTITION_PROMOTION_PROVED")
          PY
      - name: Preserve real Linux kernel TCP PostgreSQL WAL fault and recovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage040-real-kernel-netns-tcp-postgres-wal-not-multihost
          path: stage040-netns-evidence/
          retention-days: 30
          if-no-files-found: warn
