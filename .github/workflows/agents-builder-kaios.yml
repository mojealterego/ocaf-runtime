name: OCAF Agents Builder KaiOS source package

on:
  push:
    branches: [main]
    paths:
      - "apps/agents-builder-kaios/**"
      - "scripts/tests/test_builder_kaios.py"
      - "scripts/verify_kaios_package.py"
      - "scripts/tests/test_verify_kaios_package.py"
      - ".github/workflows/agents-builder-kaios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaios-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify KaiOS source contracts
        run: python3 -m unittest discover -s scripts/tests -p test_builder_kaios.py -v
      - name: Verify KaiOS package verifier regression tests
        run: python3 -m unittest discover -s scripts/tests -p test_verify_kaios_package.py -v
      - name: Check JavaScript syntax
        run: |
          node --check apps/agents-builder-kaios/app.js
          node --check apps/agents-builder-kaios/canonical-graph.js
          node --check apps/agents-builder-kaios/canonical-ui.js
      - name: Run KaiOS behavior regression tests
        run: node apps/agents-builder-kaios/tests/runtime.cjs
      - name: Verify canonical KaiOS UI integration
        run: node apps/agents-builder-kaios/tests/canonical-ui.cjs
      - name: Verify canonical KaiOS typed DAG validator
        run: node apps/agents-builder-kaios/tests/canonical-graph.cjs
      - name: Verify KaiOS NoCode node removal
        run: node apps/agents-builder-kaios/tests/delete-node.cjs
      - name: Verify KaiOS keypad softkeys
        run: node apps/agents-builder-kaios/tests/softkeys.cjs
      - name: Check KaiOS save ordering
        run: node apps/agents-builder-kaios/tests/save-regression.cjs
      - name: Install Chromium E2E dependencies
        run: |
          python3 -m venv .venv-kaios-e2e
          .venv-kaios-e2e/bin/python -m pip install --disable-pip-version-check playwright
          .venv-kaios-e2e/bin/python -m playwright install chromium
      - name: Run Chromium DOM E2E
        run: .venv-kaios-e2e/bin/python apps/agents-builder-kaios/tests/browser_e2e.py
      - name: Package KaiOS 2.5 web application
        run: |
          set -euo pipefail
          mkdir -p dist
          cd apps/agents-builder-kaios
          zip -9 -X ../../dist/ocaf-agents-builder-kaios-2.5.zip manifest.webapp index.html app.js style.css canonical-graph.js canonical-ui.js
          cd ../..
          unzip -t dist/ocaf-agents-builder-kaios-2.5.zip
          python3 scripts/verify_kaios_package.py dist/ocaf-agents-builder-kaios-2.5.zip
          (cd apps/agents-builder-kaios && sha256sum manifest.webapp index.html app.js style.css canonical-graph.js canonical-ui.js) > dist/ocaf-agents-builder-kaios-2.5.files.sha256
          sha256sum dist/ocaf-agents-builder-kaios-2.5.zip > dist/ocaf-agents-builder-kaios-2.5.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocaf-agents-builder-kaios-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
