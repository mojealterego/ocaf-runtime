name: Stage 0.42 source-bound rollback drill (ephemeral CI only)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full main commit SHA of candidate release
        required: true
        type: string
      candidate_run_id:
        description: Successful Supply Chain and Provenance run ID
        required: true
        type: string
      prior_sha:
        description: Full ancestor main commit SHA of prior release
        required: true
        type: string
      prior_run_id:
        description: Successful prior Supply Chain and Provenance run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  rollback-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: ocaf
          POSTGRES_PASSWORD: ocaf_local_test_password
          POSTGRES_DB: ocaf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocaf -d ocaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate explicit immutable identifiers
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRIOR_SHA: ${{ inputs.prior_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRIOR_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$PRIOR_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          test "$CANDIDATE_RUN_ID" != "$PRIOR_RUN_ID"
          git merge-base --is-ancestor "$PRIOR_SHA" "$CANDIDATE_SHA"
      - name: Download candidate artifact from named run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          name: ocaf-linux-x86_64-${{ inputs.candidate_sha }}
          path: candidate
      - name: Download prior artifact from named run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
          name: ocaf-linux-x86_64-${{ inputs.prior_sha }}
          path: prior
      - name: Verify both bundles and both build and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRIOR_SHA: ${{ inputs.prior_sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.verify_rollback_pair \
            --repo . --candidate candidate --prior prior \
            --candidate-sha "$CANDIDATE_SHA" --prior-sha "$PRIOR_SHA" \
            --repository "$GITHUB_REPOSITORY"
          for label in candidate prior; do
            if [[ "$label" == candidate ]]; then sha="$CANDIDATE_SHA"; else sha="$PRIOR_SHA"; fi
            archive="$label/ocaf_runtime-linux-x86_64.tar.gz"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --source-ref refs/heads/main --source-digest "$sha" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom \
              --source-ref refs/heads/main --source-digest "$sha" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml"
          done
      - name: Exercise candidate then prior CLI in disposable runner
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRIOR_SHA: ${{ inputs.prior_sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.stage042_rollback_drill \
            --repo . --candidate candidate --prior prior \
            --candidate-sha "$CANDIDATE_SHA" --prior-sha "$PRIOR_SHA" \
            --repository "$GITHUB_REPOSITORY"
      - name: Build a disposable PostgreSQL snapshot and exercise candidate against updated state
        env:
          OCAF_TEST_PG_DSN: host=127.0.0.1 port=5432 user=ocaf password=ocaf_local_test_password dbname=ocaf_test sslmode=disable
        run: |
          set -euo pipefail
          container="$(docker ps -q --filter name=postgres)"
          test -n "$container"
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U ocaf -d ocaf_test -c \
            "CREATE TABLE ocaf_pg_nodes_v2(cluster_id TEXT NOT NULL, expires_at_ms BIGINT NOT NULL);
             CREATE TABLE ocaf_pg_jobs_v1(cluster_id TEXT NOT NULL, status TEXT NOT NULL, lease_expires_at_ms BIGINT NOT NULL);
             INSERT INTO ocaf_pg_jobs_v1 VALUES ('stage042_rollback','pending',0);"
          docker exec "$container" pg_dump -U ocaf -d ocaf_test -Fc \
            -t ocaf_pg_nodes_v2 -t ocaf_pg_jobs_v1 -f /tmp/ocaf42-prior.dump
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U ocaf -d ocaf_test -c \
            "INSERT INTO ocaf_pg_jobs_v1 VALUES ('stage042_rollback','pending',0);"
          python3 -m scripts.stage042_pg_rollback_probe \
            --bundle candidate --expected-pending 2
      - name: Restore prior PostgreSQL snapshot and exercise prior signed binary
        env:
          OCAF_TEST_PG_DSN: host=127.0.0.1 port=5432 user=ocaf password=ocaf_local_test_password dbname=ocaf_test sslmode=disable
        run: |
          set -euo pipefail
          container="$(docker ps -q --filter name=postgres)"
          test -n "$container"
          docker exec "$container" pg_restore -U ocaf -d ocaf_test \
            --clean --if-exists --exit-on-error /tmp/ocaf42-prior.dump
          python3 -m scripts.stage042_pg_rollback_probe \
            --bundle prior --expected-pending 1
