name: OCAF 0.41 REAL separate-kernel PostgreSQL backup recovery (artifact transfer NOT physical DR)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage041-cross-host-restore.yml
      - scripts/stage041_cross_host_restore.py
      - scripts/stage041_backup_restore.py
      - scripts/stage041_encrypted_backup.py
      - scripts/stage041_encrypted_artifact_gate.py
      - scripts/tests/test_stage041_cross_host_restore.py
      - scripts/tests/test_stage041_encrypted_backup.py
      - scripts/tests/test_stage041_encrypted_artifact_gate.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-kernel-backup:
    name: Source Linux kernel A — actual PG custom backup after durable 25 rows
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      envelope_key_hex: ${{ steps.ephemeral_key.outputs.key_hex }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate one-run lab key through job output, separate from encrypted artifact
        id: ephemeral_key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import secrets
          print("key_hex=" + secrets.token_hex(32))
          PY
      - name: Stage PostgreSQL 16 binaries
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/16/bin/pg_dump; then
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          fi
          test -x /usr/lib/postgresql/16/bin/pg_restore
          if ! python3 -c 'import cryptography' >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-cryptography
          fi
      - name: Start real PostgreSQL, write dataset, backup/restore and shut source down
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BASE="/tmp/ocaf41-source-${GITHUB_RUN_ID}"
          sudo -n install -d -o postgres -g postgres -m 0700 "$BASE" "$BASE/data"
          sudo -n install -o postgres -g postgres -m 0500 \
            "$GITHUB_WORKSPACE/scripts/stage041_backup_restore.py" "$BASE/source_driver.py"
          sudo -n -u postgres python3 "$BASE/source_driver.py" \
            --pg-bin-dir /usr/lib/postgresql/16/bin --output-dir "$BASE/data" \
            --ack-ephemeral-postgres-backup-lab
          mkdir -p stage041-cross-source
          sudo -n cp "$BASE/data/backup-restore-report.json" stage041-cross-source/source.json
          sudo -n cp "$BASE/data/snapshot.pgcustom" stage041-cross-source/snapshot.pgcustom
          sudo -n chown "$(id -u):$(id -g)" stage041-cross-source/source.json stage041-cross-source/snapshot.pgcustom
          python3 - <<'PY'
          import hashlib,json,re,secrets
          from pathlib import Path
          root=Path("stage041-cross-source")
          source=(root/"source.json").read_bytes()
          r=json.loads(source)
          snapshot=(root/"snapshot.pgcustom").read_bytes()
          assert snapshot[:5]==b"PGDMP"
          assert r["backup_sha256"]==hashlib.sha256(snapshot).hexdigest()
          assert r["original_checksum"]==r["restored_checksum"]
          assert r["original_rows"]==r["restored_rows"]==25
          assert r["cross_host_restore_tested"] is False
          assert r["production_approved"] is False
          boot=Path("/proc/sys/kernel/random/boot_id").read_text().strip()
          assert re.fullmatch(r"[0-9a-f-]{36}",boot)
          manifest={
             "schema_version":1,"source_boot_id":boot,
             "source_report_sha256":hashlib.sha256(source).hexdigest(),
             "snapshot_sha256":hashlib.sha256(snapshot).hexdigest(),
             "snapshot_size_bytes":len(snapshot),
             "run_nonce":secrets.token_hex(8),
             "production_approved":False,
          }
          (root/"manifest.json").write_text(json.dumps(manifest,sort_keys=True)+"\n")
          print("STAGE041_REAL_SOURCE_POSTGRESQL_STOPPED_AND_PINNED_BACKUP_CREATED")
          print("STAGE041_SOURCE_LINUX_KERNEL_BOOT_ID",boot)
          PY
      - name: Authenticate and encrypt real pg_dump; upload only ciphertext
        shell: bash
        env:
          STAGE041_KEY_HEX: ${{ steps.ephemeral_key.outputs.key_hex }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from stage041_encrypted_backup import seal_snapshot
          root=Path("stage041-cross-source").resolve()
          envelope=root/"envelope";envelope.mkdir(mode=0o700)
          manifest=seal_snapshot(root/"snapshot.pgcustom",envelope,
                                 key=bytes.fromhex(os.environ["STAGE041_KEY_HEX"]),
                                 generation=1)
          assert manifest["snapshot_sha256"] in (root/"manifest.json").read_text()
          (root/"snapshot.pgcustom").unlink()
          assert not (root/"snapshot.pgcustom").exists()
          print("STAGE041_ENCRYPTED_SOURCE_ARTIFACT_HAS_NO_PLAINTEXT_DUMP")
          PY
      - name: Fail closed if plaintext remains or encrypted bundle is incomplete
        shell: bash
        run: |
          set -euo pipefail
          python3 -O -m unittest discover -s scripts/tests -p test_stage041_encrypted_artifact_gate.py -v
          python3 -O scripts/stage041_encrypted_artifact_gate.py --bundle stage041-cross-source
      - name: Preserve encrypted real backup and boot-bound digest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage041-source-pgcustom-encrypted
          path: stage041-cross-source/
          retention-days: 30
          if-no-files-found: error

  new-kernel-recovery:
    name: New Linux kernel B — verify artifact SHA, initdb and actual pg_restore
    needs: [source-kernel-backup]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download source-host encrypted artifact into fresh VM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage041-source-pgcustom-encrypted
          path: stage041-cross-download
      - name: Independently check adversarial recovery tests
        run: |
          python3 -m unittest discover -s scripts/tests -p test_stage041_cross_host_restore.py -v
          python3 -m unittest discover -s scripts/tests -p test_stage041_encrypted_backup.py -v
      - name: Stage PostgreSQL 16 binaries on separate runner
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb
          if ! python3 -c 'import cryptography' >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-cryptography
          fi
      - name: Recover into new real PostgreSQL and verify content hashes on second kernel
        shell: bash
        env:
          STAGE041_KEY_HEX: ${{ needs.source-kernel-backup.outputs.envelope_key_hex }}
        run: |
          set -euo pipefail
          umask 077
          BASE="/tmp/ocaf41-recovery-${GITHUB_RUN_ID}"
          sudo -n install -d -o postgres -g postgres -m 0700 "$BASE" "$BASE/inputs" "$BASE/evidence"
          sudo -n install -o postgres -g postgres -m 0500 \
            "$GITHUB_WORKSPACE/scripts/stage041_cross_host_restore.py" "$BASE/driver.py"
          sudo -n install -o postgres -g postgres -m 0500 \
            "$GITHUB_WORKSPACE/scripts/stage041_backup_restore.py" "$BASE/stage041_backup_restore.py"
          sudo -n install -o postgres -g postgres -m 0500 \
            "$GITHUB_WORKSPACE/scripts/stage041_encrypted_backup.py" "$BASE/stage041_encrypted_backup.py"
          sudo -n install -d -o postgres -g postgres -m 0700 "$BASE/inputs/envelope"
          for file in source.json manifest.json; do
            sudo -n install -o postgres -g postgres -m 0600 \
              "stage041-cross-download/$file" "$BASE/inputs/$file"
          done
          for file in snapshot.aesgcm manifest.json; do
            sudo -n install -o postgres -g postgres -m 0600 \
              "stage041-cross-download/envelope/$file" "$BASE/inputs/envelope/$file"
          done
          sudo -n -u postgres env STAGE041_KEY_HEX="$STAGE041_KEY_HEX" python3 - "$BASE" <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,sys.argv[1])
          from stage041_encrypted_backup import EncryptedBackupError,unseal_snapshot
          root=Path(sys.argv[1])
          envelope=root/"inputs/envelope"
          target=root/"inputs/snapshot.pgcustom"
          key=bytes.fromhex(os.environ["STAGE041_KEY_HEX"])
          record=json.loads((envelope/"manifest.json").read_text())
          for policy in ({"key":b"x"*32,"minimum_generation":1},
                         {"key":key,"minimum_generation":2},
                         {"key":key,"minimum_generation":1,
                          "revoked_key_ids":frozenset({record["key_id"]})}):
              try:unseal_snapshot(envelope,target,**policy)
              except EncryptedBackupError:pass
              else:raise AssertionError("unsafe cross-kernel encrypted recovery accepted")
          ciphertext=envelope/"snapshot.aesgcm"
          original_ciphertext=ciphertext.read_bytes()
          ciphertext.write_bytes(original_ciphertext[:-1]+bytes([original_ciphertext[-1]^1]))
          try:unseal_snapshot(envelope,target,key=key,minimum_generation=1)
          except EncryptedBackupError:pass
          else:raise AssertionError("tampered cross-kernel ciphertext accepted")
          ciphertext.write_bytes(original_ciphertext)
          assert not target.exists()
          proof=unseal_snapshot(envelope,target,key=key,minimum_generation=1)
          assert proof["immutable_offsite_storage_proved"] is False
          assert proof["snapshot_sha256"]==json.loads((root/"inputs/manifest.json").read_text())["snapshot_sha256"]
          (root/"evidence/encryption-transfer.json").write_text(json.dumps({
              "schema_version":1,
              "status":"TWO_EPHEMERAL_KERNELS_ENCRYPTED_PG_DUMP_TRANSFER_PASS",
              "source_boot_id":json.loads((root/"inputs/manifest.json").read_text())["source_boot_id"],
              "recovery_boot_id":Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "snapshot_sha256":proof["snapshot_sha256"],
              "ciphertext_sha256":proof["ciphertext_sha256"],
              "ciphertext_wrong_key_revoked_key_and_generation_rollback_denied":True,
              "key_channel":"ephemeral_github_job_output_not_independent_kms",
              "immutable_offsite_storage_proved":False,
              "stage_041_complete":False,"production_approved":False,
          },sort_keys=True)+"\n")
          print("STAGE041_TWO_EPHEMERAL_KERNELS_ENCRYPTED_PG_DUMP_DECRYPTED")
          PY
          sudo -n -u postgres python3 - "$BASE" <<'PY'
          import json,shutil,sys
          from pathlib import Path
          sys.path.insert(0,sys.argv[1])
          import driver as recovery
          d=Path(sys.argv[1])/"inputs"
          original=d/"snapshot.pgcustom"
          tampered=d/"tampered.pgcustom"
          shutil.copyfile(original,tampered)
          with tampered.open("r+b") as f:
              old=f.read(1)
              assert old
              f.seek(0)
              f.write(bytes([old[0]^1]))
          boot=Path("/proc/sys/kernel/random/boot_id").read_text().strip()
          def rejected(p,boot_id):
              try:
                  recovery.validate_transfer(p,d/"source.json",d/"manifest.json",boot_id)
              except recovery.CrossHostRestoreError:
                  return True
              return False
          assert rejected(tampered,boot), "modified real cross-host PG archive accepted"
          manifest=json.loads((d/"manifest.json").read_text())
          assert rejected(original,manifest["source_boot_id"]), "fake matching source boot accepted"
          tampered.unlink()
          print("STAGE041_REAL_DESTINATION_REJECTED_TAMPERED_ARCHIVE_AND_REUSED_KERNEL_ID")
          PY
          sudo -n -u postgres python3 "$BASE/driver.py" \
            --snapshot "$BASE/inputs/snapshot.pgcustom" \
            --source-report "$BASE/inputs/source.json" \
            --manifest "$BASE/inputs/manifest.json" \
            --pg-bin-dir /usr/lib/postgresql/16/bin \
            --report "$BASE/evidence/recovery.json" \
            --ack-cross-kernel-ephemeral-restore
          mkdir -p stage041-cross-recovered
          sudo -n cp "$BASE/evidence/recovery.json" stage041-cross-recovered/recovery.json
          sudo -n cp "$BASE/evidence/encryption-transfer.json" stage041-cross-recovered/encryption-transfer.json
          sudo -n chown "$(id -u):$(id -g)" stage041-cross-recovered/*.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("stage041-cross-recovered/recovery.json").read_text())
          assert d["status"]=="REAL_TWO_KERNEL_POSTGRESQL_SHA256_RESTORE_PASSED"
          assert d["distinct_linux_kernels"] is True
          assert d["source_boot_id"]!=d["recovery_boot_id"]
          assert d["actual_postgres_restore_confirmed"] is True
          assert d["fresh_postgres_process_started"] is True
          assert d["original_rows"]==d["recovered_rows"]==25
          assert d["original_checksum"]==d["recovered_checksum"]
          assert d["rpo_at_backup_boundary_rows_lost"]==0
          assert d["physical_host_disaster_recovery_tested"] is False
          assert d["stage_041_complete"] is False
          assert d["production_approved"] is False
          e=json.loads(Path("stage041-cross-recovered/encryption-transfer.json").read_text())
          assert e["source_boot_id"]!=e["recovery_boot_id"]
          assert e["snapshot_sha256"]==d["snapshot_sha256"]
          assert e["immutable_offsite_storage_proved"] is False
          print("STAGE041_REAL_DIFFERENT_LINUX_KERNEL_POSTGRESQL_SHA256_RECOVERY_PROVED")
          PY
      - name: Preserve recovered real PG data-hash and measured restoration time
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage041-verified-separate-kernel-postgres-restore
          path: stage041-cross-recovered/
          retention-days: 30
          if-no-files-found: warn
