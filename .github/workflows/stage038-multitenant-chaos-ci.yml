name: OCAF 0.38 Dual Tenant Real WASI systemd Chaos CI (not production GO)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage038-multitenant-chaos-ci.yml
      - scripts/stage038_multitenant_fixtures.py
      - scripts/stage038_multitenant_acceptance.py
      - docs/STAGE038_INDEPENDENT_AUDIT_HANDOFF.md
      - docs/STAGE038_ALTERNATE_LINUX_EVIDENCE_2026-10-14.md
      - scripts/tests/test_stage038_multitenant_fixtures.py
      - scripts/stage038_production_gate.py
      - scripts/tests/test_stage038_production_gate.py
      - scripts/ci_stage038_signed_wasi_fixtures.py
      - src/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage038-dual-tenant-chaos
  cancel-in-progress: false
jobs:
  dual-tenant:
    name: Two real systemd tenant coordinators, mTLS signed WASI and controlled chaos
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject forged stage 0.38 approvals and trust-anchor TOCTOU regressions
        run: python3 -m unittest discover -s scripts/tests -p test_stage038_production_gate.py -v
      - name: Validate cryptographically separated synthetic tenants
        run: python3 -m unittest discover -s scripts/tests -p test_stage038_multitenant_fixtures.py -v
      - name: Build real TLS-bound Rust binaries from locked repository
        timeout-minutes: 15
        run: cargo build --locked --features tls-bound --bin ocaf-coordinator --bin ocaf-rpc-node
      - name: Verify pinned Wasmtime and install root-controlled binaries
        run: |
          set -euo pipefail
          archive=wasmtime-v49.0.2-x86_64-linux.tar.xz
          curl --fail --silent --show-error --location --retry 4 --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/$archive" \
            -o "$RUNNER_TEMP/$archive"
          echo "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  $RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -d -m 0755 -o root -g root /opt/ocaf/bin
          sudo install -m 0755 -o root -g root "$RUNNER_TEMP/wasmtime-v49.0.2-x86_64-linux/wasmtime" /opt/ocaf/bin/wasmtime
          sudo install -m 0755 -o root -g root target/debug/ocaf-coordinator /opt/ocaf/bin/ocaf-coordinator
      - name: Create separate tenant-scoped CA and signed WASIp1 fixtures
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/stage038_multitenant_fixtures.py --directory "$RUNNER_TEMP/ocaf-multitenant"
      - name: Launch real parallel systemd coordinators and enforce cgroup v2 policies
        timeout-minutes: 7
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true
          test "$(uname -m)" = x86_64
          if ! id ocaf >/dev/null 2>&1; then sudo useradd --system --no-create-home --shell /usr/sbin/nologin ocaf; fi
          hash="$(sha256sum /opt/ocaf/bin/wasmtime | cut -d ' ' -f 1)"
          for tenant in tenant-a tenant-b; do
            sudo install -d -m 0700 -o ocaf -g ocaf "/var/lib/ocaf-$tenant"
            sudo install -o ocaf -g ocaf -m 0600 /dev/null "/var/lib/ocaf-$tenant/coordinator.log"
            for name in module.wasm manifest.json manifest.sig publisher.pem server.pem server.key ca.pem peers.json agent-a.pem agent-b.pem; do
              sudo install -o ocaf -g ocaf -m 0600 \
                "$RUNNER_TEMP/ocaf-multitenant/$tenant/$name" "/var/lib/ocaf-$tenant/$name"
            done
            port="$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
            if [ "$tenant" = tenant-a ]; then echo "OCAF_PORT_A=$port" >> "$GITHUB_ENV"; else echo "OCAF_PORT_B=$port" >> "$GITHUB_ENV"; fi
            sudo systemd-run --unit="ocaf-$tenant" --service-type=exec \
              --property=User=ocaf --property=Group=ocaf \
              --property=WorkingDirectory="/var/lib/ocaf-$tenant" \
              --property=ProtectSystem=strict --property=ReadWritePaths="/var/lib/ocaf-$tenant" \
              --property=PrivateTmp=yes --property=NoNewPrivileges=yes \
              --property=KillMode=control-group --property=Restart=on-failure \
              --property=RestartSec=1s \
              --property=MemoryMax=1610612736 --property=TasksMax=128 \
              --property=CPUQuota=200% --property=LimitCORE=0 \
              --property=RuntimeMaxSec=1500s \
              --property=StandardOutput="append:/var/lib/ocaf-$tenant/coordinator.log" \
              --property=StandardError="append:/var/lib/ocaf-$tenant/coordinator.log" \
              --setenv="OCAF_COORDINATOR_NODE_ID=coord-$tenant" \
              --setenv=OCAF_COORDINATOR_MODE=active \
              --setenv="OCAF_REPLAY_DB_PATH=/var/lib/ocaf-$tenant/replay.sqlite" \
              --setenv="OCAF_COORDINATOR_DB_PATH=/var/lib/ocaf-$tenant/coordinator.sqlite" \
              --setenv="OCAF_JOBS_DB_PATH=/var/lib/ocaf-$tenant/jobs.sqlite" \
              --setenv="OCAF_COORDINATOR_LOCK_PATH=/var/lib/ocaf-$tenant/leader.lock" \
              --setenv="OCAF_PEERS_FILE=/var/lib/ocaf-$tenant/peers.json" \
              --setenv=OCAF_RPC_INGRESS=tls-bound \
              --setenv=OCAF_REQUIRE_PEER_CERT_POP=1 \
              --setenv="OCAF_TENANT_NAMESPACE=$tenant" \
              --setenv="OCAF_TLS_RPC_BIND=127.0.0.1:$port" \
              --setenv="OCAF_TLS_SERVER_CERT_FILE=/var/lib/ocaf-$tenant/server.pem" \
              --setenv="OCAF_TLS_SERVER_KEY_FILE=/var/lib/ocaf-$tenant/server.key" \
              --setenv="OCAF_TLS_CLIENT_CA_FILE=/var/lib/ocaf-$tenant/ca.pem" \
              --setenv="OCAF_WASI_MANIFEST_FILE=/var/lib/ocaf-$tenant/manifest.json" \
              --setenv="OCAF_WASI_SIGNATURE_FILE=/var/lib/ocaf-$tenant/manifest.sig" \
              --setenv="OCAF_WASI_PUBLISHER_KEY_FILE=/var/lib/ocaf-$tenant/publisher.pem" \
              --setenv="OCAF_WASI_MODULE_FILE=/var/lib/ocaf-$tenant/module.wasm" \
              --setenv=OCAF_WASMTIME_EXECUTABLE=/opt/ocaf/bin/wasmtime \
              --setenv="OCAF_WASMTIME_SHA256=$hash" \
              /opt/ocaf/bin/ocaf-coordinator
          done
          for tenant in tenant-a tenant-b; do
            systemctl is-active --quiet "ocaf-$tenant.service" || exit 2
          done
      - name: Verify both systemd cgroups with read-only host gates
        run: |
          set -euo pipefail
          python3 scripts/stage038_host_gate.py --unit ocaf-tenant-a.service --report host-tenant-a.json
          python3 scripts/stage038_host_gate.py --unit ocaf-tenant-b.service --report host-tenant-b.json
      - name: Execute positive/negative tenant authorization and SIGKILL/TCP recovery checks
        timeout-minutes: 8
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/stage038_multitenant_acceptance.py \
            --directory "$RUNNER_TEMP/ocaf-multitenant" \
            --binary "$GITHUB_WORKSPACE/target/debug/ocaf-rpc-node" \
            --port-a "$OCAF_PORT_A" --port-b "$OCAF_PORT_B" \
            --report stage038-multitenant-chaos-report.json
      - name: Emit bounded secret-free coordinator health diagnostics on failures
        if: failure()
        run: |
          for tenant in tenant-a tenant-b; do
            printf '%s\n' "SYSTEMD_HEALTH_FOR_$tenant"
            sudo systemctl show "ocaf-$tenant.service" \
              --property=ActiveState --property=SubState \
              --property=MainPID --property=ExecMainStatus \
              --property=NRestarts --no-pager || true
            sudo grep -Eo 'wasi_failure_class=[a-z_]+' \
              "/var/lib/ocaf-$tenant/coordinator.log" 2>/dev/null | \
              sort | uniq -c || true
            sudo grep -Eo 'authenticated RPC tool call failed|RPC ingress|TLS-bound|WASI runtime|error: [A-Za-z_]+' \
              "/var/lib/ocaf-$tenant/coordinator.log" 2>/dev/null | \
              sort | uniq -c || true
          done
      - name: Upload only sanitized disposable CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage038-multitenant-chaos-ci-evidence
          path: |
            stage038-multitenant-chaos-report.json
            host-tenant-a.json
            host-tenant-b.json
          retention-days: 30
          if-no-files-found: warn
      - name: Stop both ephemeral systemd services
        if: always()
        run: sudo systemctl stop ocaf-tenant-a.service ocaf-tenant-b.service 2>/dev/null || true
