name: OCAF 0.38 Signed WASI systemd TLS staging probe (ephemeral CI, NO-GO)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage038-signed-wasi-systemd-ci.yml"
      - "scripts/ci_stage038_signed_wasi_fixtures.py"
      - "scripts/stage038_host_gate.py"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocaf038-signed-systemd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-wasi-systemd:
    name: Root-owned Wasmtime, signed tool, two peer certs, systemd/cgroup probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exactly main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual TLS-bound OCAF coordinator with locked dependencies
        run: cargo build --locked --features tls-bound --bin ocaf-coordinator --bin ocaf-rpc-node
      - name: Verify and install pinned real Wasmtime 49.0.2 under root control
        shell: bash
        run: |
          set -euo pipefail
          archive=wasmtime-v49.0.2-x86_64-linux.tar.xz
          install -d "$RUNNER_TEMP/ocaf-engine"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/$archive" \
            -o "$RUNNER_TEMP/ocaf-engine/$archive"
          echo "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  $RUNNER_TEMP/ocaf-engine/$archive" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/ocaf-engine/$archive" -C "$RUNNER_TEMP/ocaf-engine"
          sudo install -d -m 0755 -o root -g root /opt/ocaf/bin
          sudo install -m 0755 -o root -g root \
            "$RUNNER_TEMP/ocaf-engine/wasmtime-v49.0.2-x86_64-linux/wasmtime" \
            /opt/ocaf/bin/wasmtime
          sudo install -m 0755 -o root -g root target/debug/ocaf-coordinator /opt/ocaf/bin/ocaf-coordinator
          /opt/ocaf/bin/wasmtime --version
      - name: Generate private synthetic CA, peer identities, and Ed25519-signed WASI fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_stage038_signed_wasi_fixtures.py \
            --directory "$RUNNER_TEMP/ocaf038-signed"
      - name: Launch real signed-WASI coordinator under strict systemd cgroup limits
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true
          test "$(uname -m)" = x86_64
          fixture="$RUNNER_TEMP/ocaf038-signed"
          unit=ocaf-ci-signed-wasi.service
          trap 'sudo systemctl stop "$unit" >/dev/null 2>&1 || true' EXIT
          if ! id ocaf >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin ocaf
          fi
          sudo install -d -o ocaf -g ocaf -m 0700 /var/lib/ocaf
          sudo install -o ocaf -g ocaf -m 0600 /dev/null /var/lib/ocaf/ci-signed-wasi-diagnostics.log
          for filename in module.wasm manifest.json manifest.sig publisher.pem \
                          server.pem server.key ca.pem agent-a.pem agent-b.pem peers.json; do
            sudo install -o ocaf -g ocaf -m 0600 \
              "$fixture/$filename" "/var/lib/ocaf/$filename"
          done
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          wasmtime_sha="$(sha256sum /opt/ocaf/bin/wasmtime | cut -d ' ' -f 1)"
          sudo systemd-run --unit=ocaf-ci-signed-wasi --service-type=exec \
            --property=User=ocaf --property=Group=ocaf \
            --property=WorkingDirectory=/var/lib/ocaf \
            --property=ProtectSystem=strict --property=ReadWritePaths=/var/lib/ocaf \
            --property=PrivateTmp=yes --property=NoNewPrivileges=yes \
            --property=KillMode=control-group --property=Restart=no \
            --property=MemoryMax=1610612736 --property=TasksMax=128 \
            --property=CPUQuota=200% --property=LimitCORE=0 \
            --property=RuntimeMaxSec=150s \
            --property=StandardOutput=append:/var/lib/ocaf/ci-signed-wasi-diagnostics.log \
            --property=StandardError=append:/var/lib/ocaf/ci-signed-wasi-diagnostics.log \
            --setenv=OCAF_COORDINATOR_NODE_ID=coord-ci \
            --setenv=OCAF_COORDINATOR_MODE=active \
            --setenv=OCAF_REPLAY_DB_PATH=/var/lib/ocaf/replay.sqlite \
            --setenv=OCAF_COORDINATOR_DB_PATH=/var/lib/ocaf/coordinator.sqlite \
            --setenv=OCAF_JOBS_DB_PATH=/var/lib/ocaf/jobs.sqlite \
            --setenv=OCAF_COORDINATOR_LOCK_PATH=/var/lib/ocaf/leader.lock \
            --setenv=OCAF_PEERS_FILE=/var/lib/ocaf/peers.json \
            --setenv=OCAF_RPC_INGRESS=tls-bound \
            --setenv=OCAF_REQUIRE_PEER_CERT_POP=1 \
            --setenv=OCAF_TENANT_NAMESPACE=tenant-ci \
            --setenv=OCAF_TLS_RPC_BIND="127.0.0.1:$port" \
            --setenv=OCAF_TLS_SERVER_CERT_FILE=/var/lib/ocaf/server.pem \
            --setenv=OCAF_TLS_SERVER_KEY_FILE=/var/lib/ocaf/server.key \
            --setenv=OCAF_TLS_CLIENT_CA_FILE=/var/lib/ocaf/ca.pem \
            --setenv=OCAF_WASI_MANIFEST_FILE=/var/lib/ocaf/manifest.json \
            --setenv=OCAF_WASI_SIGNATURE_FILE=/var/lib/ocaf/manifest.sig \
            --setenv=OCAF_WASI_PUBLISHER_KEY_FILE=/var/lib/ocaf/publisher.pem \
            --setenv=OCAF_WASI_MODULE_FILE=/var/lib/ocaf/module.wasm \
            --setenv=OCAF_WASMTIME_EXECUTABLE=/opt/ocaf/bin/wasmtime \
            --setenv=OCAF_WASMTIME_SHA256="$wasmtime_sha" \
            /opt/ocaf/bin/ocaf-coordinator
          for i in $(seq 1 45); do
            if systemctl is-active --quiet "$unit" && \
               python3 - "$port" <<'PY'
          import socket,sys
          try:
              with socket.create_connection(("127.0.0.1", int(sys.argv[1])), timeout=0.5):
                  pass
          except OSError:
              sys.exit(1)
          PY
            then
              break
            fi
            sleep 0.3
          done
          systemctl is-active --quiet "$unit" || {
            echo "::error::Signed WASI TLS coordinator failed startup"
            sudo systemctl status "$unit" --no-pager || true
            exit 1
          }
          python3 - "$port" "$fixture" <<'PY'
          import socket, ssl, sys
          port, root = int(sys.argv[1]), sys.argv[2]
          for name in ("agent-a", "agent-b"):
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              context.minimum_version = ssl.TLSVersion.TLSv1_3
              context.load_verify_locations(cafile=root + "/ca.pem")
              context.load_cert_chain(root + "/" + name + ".pem", root + "/" + name + ".key")
              with socket.create_connection(("127.0.0.1", port), timeout=4) as raw:
                  with context.wrap_socket(raw, server_hostname="localhost") as peer:
                      if peer.version() != "TLSv1.3":
                          raise SystemExit("TLS downgrade rejected")
          print("TWO_SYNTHETIC_MTLS_CLIENT_CERTIFICATE_HANDSHAKES_OK")
          PY
          for agent in agent-a agent-b; do
            export OCAF_ROLE=client
            export OCAF_NODE_ID="$agent"
            export OCAF_PEER_ID=coord-ci
            export OCAF_SHARED_KEY_B64="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]]["key_b64"])' "$fixture/peers.json" "$agent")"
            export OCAF_RPC_CERT_KEY_FILE="$fixture/$agent.key"
            export OCAF_RPC_INGRESS=tls-bound
            export OCAF_TLS_CLIENT_CERT_FILE="$fixture/$agent.pem"
            export OCAF_TLS_CLIENT_KEY_FILE="$fixture/$agent.key"
            export OCAF_TLS_SERVER_CA_FILE="$fixture/ca.pem"
            export OCAF_TLS_RPC_ADDRESS="127.0.0.1:$port"
            export OCAF_TLS_RPC_SERVER_DNS=localhost
            export OCAF_ACTION=discover
            response="$(target/debug/ocaf-rpc-node)"
            python3 -c 'import json,sys; data=json.loads(sys.stdin.read()); assert isinstance(data.get("output"),list) and any(isinstance(tool,dict) and tool.get("name")=="ocaf_ci_noop" for tool in data["output"]), "Signed WASI tool missing from authenticated discovery"' <<< "$response"
            echo "SYNTHETIC_TLS_BOUND_SIGNED_TOOL_DISCOVERY_PASSED"
            if [ "$agent" = agent-a ]; then
              export OCAF_ACTION=call
              export OCAF_TOOL=ocaf_ci_noop
              export OCAF_MESSAGE=ci_test_message
              target/debug/ocaf-rpc-node >/dev/null
              echo "SIGNED_WASI_EXECUTION_OVER_MTLS_PASSED"
            else
              export OCAF_ACTION=call
              export OCAF_TOOL=ocaf_ci_noop
              export OCAF_MESSAGE=unauthorized_cross_principal
              if target/debug/ocaf-rpc-node >/dev/null 2>&1; then
                echo "::error::Signed agent-a WASI was executable by another principal"
                exit 1
              fi
              echo "CROSS_PRINCIPAL_WASI_EXECUTION_DENIED"
            fi
          done
          python3 scripts/stage038_host_gate.py \
            --unit "$unit" --report stage038-signed-wasi-systemd-host.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          evidence = {
              "schema_version":1,
              "commit":os.environ["GITHUB_SHA"],
              "real_coordinator_systemd_active_with_signed_wasi_admission":True,
              "pinned_real_wasmtime":True,
              "synthetic_client_cert_handshakes":2,
              "signed_wasi_rpc_discovery_clients":2,
              "signed_wasi_module_executed_over_rpc":True,
              "cross_principal_guest_execution_denied":True,
              "real_multi_host_staging":False,
              "two_tenant_end_to_end_execution":False,
              "independent_auditor_signoff":False,
              "stage_038_complete":False,
              "production_approved":False,
          }
          Path("stage038-signed-wasi-ci-result.json").write_text(json.dumps(evidence,indent=2)+"\n")
          PY
      - name: Report fixed-category WASI failure from systemd without journal contents
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          # Do not print raw journal entries: they may contain user data.
          categories="$(sudo grep -oE 'wasi(_guest)?_failure_class="[a-z_]+"|wasi(_guest)?_failure_class=[a-z_]+' /var/lib/ocaf/ci-signed-wasi-diagnostics.log 2>/dev/null | sort -u || true)"
          echo "STAGE038_DIAGNOSTIC_BYTES=$(sudo stat -c %s /var/lib/ocaf/ci-signed-wasi-diagnostics.log 2>/dev/null || echo 0)"
          if [ -n "$categories" ]; then
            echo "STAGE038_SANITIZED_FAILURE_CLASS=$categories"
          else
            echo "STAGE038_SANITIZED_FAILURE_CLASS=unavailable"
          fi
      - name: Differential Wasmtime probes without guest logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          # Run the same checked-in synthetic module independently from OCAF.
          # Diagnostic output is private and discarded, never archived.
          module=/var/lib/ocaf/module.wasm
          opts='fuel=2000000,max-memory-size=33554432,max-wasm-stack=1048576,max-instances=1,max-memories=1,max-tables=1,nan-canonicalization=y'
          plain_log="$RUNNER_TEMP/ocaf038-wasmtime-plain-private.log"
          systemd_log="$RUNNER_TEMP/ocaf038-wasmtime-systemd-private.log"
          set +e
          sudo -u ocaf /usr/bin/env -i /opt/ocaf/bin/wasmtime run -W "$opts" "$module" </dev/null >"$plain_log" 2>&1
          plain_rc=$?
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit=ocaf-ci-wasmtime-direct --service-type=exec \
            --property=User=ocaf --property=Group=ocaf \
            --property=WorkingDirectory=/var/lib/ocaf \
            --property=ProtectSystem=strict --property=ReadWritePaths=/var/lib/ocaf \
            --property=PrivateTmp=yes --property=NoNewPrivileges=yes \
            --property=KillMode=control-group --property=Restart=no \
            --property=MemoryMax=1610612736 --property=TasksMax=128 \
            --property=CPUQuota=200% --property=LimitCORE=0 \
            /usr/bin/env -i /opt/ocaf/bin/wasmtime run -W "$opts" "$module" \
            </dev/null >"$systemd_log" 2>&1
          systemd_rc=$?
          set -e
          # Distinguish Unix file access, engine startup and Wasm invocation.
          if sudo -u ocaf test -r "$module"; then
            echo "STAGE038_UNPRIVILEGED_MODULE_READ=pass"
          else
            echo "STAGE038_UNPRIVILEGED_MODULE_READ=fail"
          fi
          if sudo -u ocaf test -x /opt/ocaf/bin/wasmtime; then
            echo "STAGE038_UNPRIVILEGED_ENGINE_EXEC_BIT=pass"
          else
            echo "STAGE038_UNPRIVILEGED_ENGINE_EXEC_BIT=fail"
          fi
          version_log="$RUNNER_TEMP/ocaf038-wasmtime-version-private.log"
          basic_log="$RUNNER_TEMP/ocaf038-wasmtime-basic-private.log"
          set +e
          sudo -u ocaf /usr/bin/env -i /opt/ocaf/bin/wasmtime --version >"$version_log" 2>&1
          version_rc=$?
          sudo -u ocaf /usr/bin/env -i /opt/ocaf/bin/wasmtime run "$module" </dev/null >"$basic_log" 2>&1
          basic_rc=$?
          set -e
          if [ "$version_rc" -eq 0 ] && grep -q '^wasmtime ' "$version_log"; then
            echo "STAGE038_UNPRIVILEGED_ENGINE_START=pass"
          else
            echo "STAGE038_UNPRIVILEGED_ENGINE_START=fail"
          fi
          if [ "$basic_rc" -eq 0 ] && grep -qx '{"ok":true}' "$basic_log"; then
            echo "STAGE038_UNPRIVILEGED_BASIC_WASM=pass"
          else
            echo "STAGE038_UNPRIVILEGED_BASIC_WASM=fail"
          fi
          # GitHub runner workspaces may not be searchable by the service UID.
          # Compare the exact same CLI invocation after changing to an
          # operator-owned, searchable cwd; never output guest stderr.
          cwd_log="$RUNNER_TEMP/ocaf038-wasmtime-cwd-private.log"
          set +e
          sudo -u ocaf /usr/bin/env -i /bin/sh -c 'cd /var/lib/ocaf && exec /opt/ocaf/bin/wasmtime run -W "$1" /var/lib/ocaf/module.wasm' sh "$opts" </dev/null >"$cwd_log" 2>&1
          cwd_rc=$?
          set -e
          if [ "$cwd_rc" -eq 0 ] && grep -qx '{"ok":true}' "$cwd_log"; then
            echo "STAGE038_UNPRIVILEGED_CWD_FIXED_WASM=pass"
          else
            echo "STAGE038_UNPRIVILEGED_CWD_FIXED_WASM=fail"
          fi
          if grep -iq 'permission denied' "$cwd_log"; then
            echo "STAGE038_CWD_FIXED_ERROR_CLASS=permission_denied"
          else
            echo "STAGE038_CWD_FIXED_ERROR_CLASS=other_or_none"
          fi
          rm -f -- "$cwd_log"
          # Control cases: distinguish a malformed fixture from restrictions
          # specific to the isolated service UID or an unset home/cache.
          root_log="$RUNNER_TEMP/ocaf038-wasmtime-root-private.log"
          home_log="$RUNNER_TEMP/ocaf038-wasmtime-home-private.log"
          set +e
          sudo /usr/bin/env -i /opt/ocaf/bin/wasmtime run -W "$opts" "$module" </dev/null >"$root_log" 2>&1
          root_rc=$?
          sudo -u ocaf /usr/bin/env -i /bin/sh -c 'cd /var/lib/ocaf && exec /usr/bin/env HOME=/var/lib/ocaf XDG_CACHE_HOME=/var/lib/ocaf /opt/ocaf/bin/wasmtime run -W "$1" /var/lib/ocaf/module.wasm' sh "$opts" </dev/null >"$home_log" 2>&1
          home_rc=$?
          set -e
          if [ "$root_rc" -eq 0 ] && grep -qx '{"ok":true}' "$root_log"; then
            echo "STAGE038_ROOT_WASMTIME_FIXTURE=pass"
          else
            echo "STAGE038_ROOT_WASMTIME_FIXTURE=fail"
          fi
          if [ "$home_rc" -eq 0 ] && grep -qx '{"ok":true}' "$home_log"; then
            echo "STAGE038_UNPRIVILEGED_HOME_SET_WASM=pass"
          else
            echo "STAGE038_UNPRIVILEGED_HOME_SET_WASM=fail"
          fi
          for kind in root home; do
            if [ "$kind" = root ]; then diagnostic="$root_log"; else diagnostic="$home_log"; fi
            if grep -iq 'permission denied' "$diagnostic"; then
              echo "STAGE038_${kind}_ERROR_CLASS=permission_denied"
            elif grep -iq 'invalid value\|unknown option\|unexpected argument' "$diagnostic"; then
              echo "STAGE038_${kind}_ERROR_CLASS=wasmtime_cli_rejected"
            else
              echo "STAGE038_${kind}_ERROR_CLASS=other_or_none"
            fi
          done
          rm -f -- "$root_log" "$home_log"
          # These are fixed, allowlisted labels only. Never print captured stderr.
          for kind in plain systemd basic; do
            case "$kind" in
              plain) diagnostic="$plain_log" ;;
              systemd) diagnostic="$systemd_log" ;;
              basic) diagnostic="$basic_log" ;;
            esac
            if grep -iq 'permission denied' "$diagnostic"; then
              echo "STAGE038_${kind}_ERROR_CLASS=permission_denied"
            elif grep -iq 'invalid value\|unknown option\|unexpected argument' "$diagnostic"; then
              echo "STAGE038_${kind}_ERROR_CLASS=wasmtime_cli_rejected"
            elif grep -iq 'failed to load\|failed to read' "$diagnostic"; then
              echo "STAGE038_${kind}_ERROR_CLASS=module_load_failed"
            else
              echo "STAGE038_${kind}_ERROR_CLASS=other_or_none"
            fi
          done
          rm -f -- "$version_log" "$basic_log"
          if [ "$plain_rc" -eq 0 ] && grep -qx '{"ok":true}' "$plain_log"; then
            echo "STAGE038_PLAIN_WASMTIME=pass"
          else
            echo "STAGE038_PLAIN_WASMTIME=fail"
          fi
          if [ "$systemd_rc" -eq 0 ] && grep -qx '{"ok":true}' "$systemd_log"; then
            echo "STAGE038_HARDENED_SYSTEMD_WASMTIME=pass"
          else
            echo "STAGE038_HARDENED_SYSTEMD_WASMTIME=fail"
          fi
          rm -f -- "$plain_log" "$systemd_log"
      - name: Archive sanitized evidence only, never ephemeral signing keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocaf038-signed-wasi-systemd-ci
          path: |
            stage038-signed-wasi-systemd-host.json
            stage038-signed-wasi-ci-result.json
          retention-days: 30
          if-no-files-found: warn
