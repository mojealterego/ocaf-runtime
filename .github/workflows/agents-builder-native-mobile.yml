name: OCAF Agents Builder native Android and iOS builds
on:
  push:
    branches: [main]
    paths:
      - "apps/agents-builder-android/**"
      - "apps/agents-builder-ios/**"
      - "apps/agents-builder-web/**"
      - "scripts/tests/test_builder_mobile_native.py"
      - ".github/workflows/agents-builder-native-mobile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Verify artifact verifier regression tests
        run: python3 -m unittest discover -s scripts/tests -p test_verify_native_artifact.py -v
      - name: Native mobile source contracts
        run: python3 -m unittest discover -s scripts/tests -p test_builder_mobile_native.py -v
      - name: Bundle shared editor into Android assets
        run: |
          mkdir -p apps/agents-builder-android/app/src/main/assets
          cp apps/agents-builder-web/{index.html,app.mjs,editor.mjs,cloud.mjs,i18n.mjs,credentials.mjs,models.mjs,integrations-ui.mjs,runner-client.mjs,style.css,manifest.webmanifest,sw.js} apps/agents-builder-android/app/src/main/assets/
      - name: Build Android debug APK
        working-directory: apps/agents-builder-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Android APK structure
        run: python3 scripts/verify_native_artifact.py android apps/agents-builder-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Android emulator install and launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install -r apps/agents-builder-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n org.ocaf.agentsbuilder/.MainActivity
            sleep 5
            adb shell pidof org.ocaf.agentsbuilder
            mkdir -p apps/agents-builder-android/build/evidence
            adb exec-out screencap -p > apps/agents-builder-android/build/evidence/android-launch.png
            test -s apps/agents-builder-android/build/evidence/android-launch.png
            adb shell uiautomator dump /sdcard/ocaf-ui.xml
            adb pull /sdcard/ocaf-ui.xml apps/agents-builder-android/build/evidence/android-ui.xml
            python3 - <<'PY'
            from pathlib import Path
            from xml.etree import ElementTree
            p = Path("apps/agents-builder-android/build/evidence/android-launch.png")
            assert p.read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a"), "Screenshot is not PNG"
            ui = Path("apps/agents-builder-android/build/evidence/android-ui.xml")
            root = ElementTree.parse(ui).getroot()
            assert root.tag == "hierarchy", "Invalid Android UI hierarchy"
            assert list(root.iter("node")), "Empty Android UI hierarchy"
            print("Android screenshot and UI hierarchy validated")
            PY
            adb shell dumpsys activity activities | grep -F 'org.ocaf.agentsbuilder'
            adb logcat -d -t 1500 | grep -E 'FATAL EXCEPTION|Process: org.ocaf.agentsbuilder' > /tmp/ocaf-crash-lines || true
            test ! -s /tmp/ocaf-crash-lines
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "ocaf-builder-android-launch-evidence-${{ github.sha }}"
          path: apps/agents-builder-android/build/evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "ocaf-builder-android-${{ github.sha }}"
          path: apps/agents-builder-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native mobile source contracts
        run: python3 -m unittest discover -s scripts/tests -p test_builder_mobile_native.py -v
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Bundle shared editor into iOS resources
        run: |
          mkdir -p apps/agents-builder-ios/Resources/Editor
          cp apps/agents-builder-web/{index.html,app.mjs,editor.mjs,cloud.mjs,i18n.mjs,credentials.mjs,models.mjs,integrations-ui.mjs,runner-client.mjs,style.css,manifest.webmanifest,sw.js} apps/agents-builder-ios/Resources/Editor/
      - name: Generate native Xcode project
        working-directory: apps/agents-builder-ios
        run: xcodegen generate
      - name: Build unsigned iOS simulator application
        working-directory: apps/agents-builder-ios
        run: xcodebuild -project OCAFAgentsBuilder.xcodeproj -scheme OCAFAgentsBuilder -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
      - name: Verify iOS simulator Mach-O executable
        run: python3 scripts/verify_native_artifact.py ios apps/agents-builder-ios/build/Build/Products/Debug-iphonesimulator/OCAFAgentsBuilder.app/OCAFAgentsBuilder
      - name: iOS simulator install and launch smoke
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for group in data["devices"].values() for d in group if d["isAvailable"] and "iPhone" in d["name"]), ""))')
          test -n "$device"
          if ! xcrun simctl list devices booted | grep -Fq "$device"; then
            xcrun simctl boot "$device"
          fi
          xcrun simctl bootstatus "$device" -b
          app="apps/agents-builder-ios/build/Build/Products/Debug-iphonesimulator/OCAFAgentsBuilder.app"
          xcrun simctl install "$device" "$app"
          launch_output=$(xcrun simctl launch "$device" org.ocaf.agentsbuilder)
          printf "%s\n" "$launch_output"
          echo "$launch_output" | grep -F "org.ocaf.agentsbuilder:"
          sleep 5
          mkdir -p apps/agents-builder-ios/build/evidence
          xcrun simctl io "$device" screenshot apps/agents-builder-ios/build/evidence/ios-launch.png
          python3 -c 'from pathlib import Path; p=Path("apps/agents-builder-ios/build/evidence/ios-launch.png"); assert p.stat().st_size > 1024; assert p.read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "ocaf-builder-ios-launch-evidence-${{ github.sha }}"
          path: apps/agents-builder-ios/build/evidence/ios-launch.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "ocaf-builder-ios-simulator-${{ github.sha }}"
          path: apps/agents-builder-ios/build/Build/Products/Debug-iphonesimulator/OCAFAgentsBuilder.app
          if-no-files-found: error
          retention-days: 30
