name: Stage 0.43 OMAs/OMAt Security

on:
  push:
    branches: [main]
    paths:
      - "src/omas_server.rs"
      - "src/agent_fleet.rs"
      - "src/omat_server.rs"
      - "src/bin/ocaf-omas-server.rs"
      - "src/bin/ocaf-omat-server.rs"
      - "tests/stage043_security.rs"
      - "tests/stage043_signed_manifest.rs"
      - "tests/stage043_persistence.rs"
      - "tests/stage043_cli.rs"
      - "tests/stage043_signed_agent.rs"
      - "src/stage043_signed_agent.rs"
      - "src/stage043_store.rs"
      - "src/stage043_signed_manifest.rs"
      - ".github/workflows/stage043-omas-omat.yml"
  pull_request:
    paths:
      - "src/omas_server.rs"
      - "src/agent_fleet.rs"
      - "src/omat_server.rs"
      - "src/bin/ocaf-omas-server.rs"
      - "src/bin/ocaf-omat-server.rs"
      - "tests/stage043_security.rs"
      - "tests/stage043_signed_manifest.rs"
      - "tests/stage043_persistence.rs"
      - "tests/stage043_cli.rs"
      - "tests/stage043_signed_agent.rs"
      - "src/stage043_signed_agent.rs"
      - "src/stage043_store.rs"
      - "src/stage043_signed_manifest.rs"
      - ".github/workflows/stage043-omas-omat.yml"

permissions:
  contents: read

jobs:
  native-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - name: Native OMAs and OMAt tenant/security regressions
        run: cargo test --locked --no-default-features --test stage043_security
      - name: Signed manifest authenticity and tenant acceptance
        run: cargo test --locked --no-default-features --test stage043_signed_manifest
      - name: Signed manifest persistence and revocation
        run: cargo test --locked --no-default-features --test stage043_persistence
      - name: Signed OMAs agent admission and durable replay
        run: cargo test --locked --no-default-features --test stage043_signed_agent
      - name: Standalone OMAs and OMAt process acceptance
        run: cargo test --locked --no-default-features --test stage043_cli
      - name: OMAs and OMAt existing unit tests
        run: |
          cargo test --locked --no-default-features omas_server::tests
          cargo test --locked --no-default-features omat_server::tests
      - name: Stage 0.43 formatting (other stages have their own global gate)
        run: rustfmt --check --edition 2021 tests/stage043_security.rs src/omas_server.rs src/omat_server.rs src/bin/ocaf-omas-server.rs src/bin/ocaf-omat-server.rs src/stage043_signed_manifest.rs tests/stage043_signed_manifest.rs src/stage043_store.rs tests/stage043_persistence.rs tests/stage043_cli.rs src/stage043_signed_agent.rs tests/stage043_signed_agent.rs
      - name: Stage 0.43 Clippy
        run: cargo clippy --locked --no-default-features --test stage043_security -- -D warnings
