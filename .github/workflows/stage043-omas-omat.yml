name: Stage 0.43 OMAs/OMAt Security

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/omas_server.rs"
      - "src/agent_fleet.rs"
      - "src/omat_server.rs"
      - "src/bin/ocaf-omas-server.rs"
      - "src/bin/ocaf-omas-mtls-server.rs"
      - "src/bin/ocaf-omat-server.rs"
      - "tests/stage043_security.rs"
      - "tests/stage043_signed_manifest.rs"
      - "tests/stage043_persistence.rs"
      - "tests/stage043_cli.rs"
      - "tests/stage043_signed_agent.rs"
      - "src/stage043_signed_agent.rs"
      - "src/stage043_mtls_admission.rs"
      - "src/stage043_omat_route.rs"
      - "src/stage043_omat_zenoh.rs"
      - "tests/stage043_omat_zenoh.rs"
      - "src/bin/ocaf-omat-zenoh.rs"
      - "src/bin/ocaf-omas-zenoh-client.rs"
      - "Cargo.toml"
      - "scripts/stage043_zenoh_process_e2e.sh"
      - "scripts/stage043_zenoh_ca_rotation_e2e.sh"
      - "vendor/zenoh-link-tls/src/utils.rs"
      - "tests/stage043_omat_route.rs"
      - "tests/stage043_mtls.rs"
      - "tests/stage043_mtls_cli.rs"
      - "tests/stage043_mtls_network.rs"
      - "src/stage043_store.rs"
      - "src/stage043_agent_store.rs"
      - "tests/stage043_agent_persistence.rs"
      - "src/stage043_signed_manifest.rs"
      - ".github/workflows/stage043-omas-omat.yml"
  pull_request:
    paths:
      - "src/omas_server.rs"
      - "src/agent_fleet.rs"
      - "src/omat_server.rs"
      - "src/bin/ocaf-omas-server.rs"
      - "src/bin/ocaf-omas-mtls-server.rs"
      - "src/bin/ocaf-omat-server.rs"
      - "tests/stage043_security.rs"
      - "tests/stage043_signed_manifest.rs"
      - "tests/stage043_persistence.rs"
      - "tests/stage043_cli.rs"
      - "tests/stage043_signed_agent.rs"
      - "src/stage043_signed_agent.rs"
      - "src/stage043_mtls_admission.rs"
      - "src/stage043_omat_route.rs"
      - "src/stage043_omat_zenoh.rs"
      - "tests/stage043_omat_zenoh.rs"
      - "src/bin/ocaf-omat-zenoh.rs"
      - "src/bin/ocaf-omas-zenoh-client.rs"
      - "Cargo.toml"
      - "scripts/stage043_zenoh_process_e2e.sh"
      - "scripts/stage043_zenoh_ca_rotation_e2e.sh"
      - "vendor/zenoh-link-tls/src/utils.rs"
      - "tests/stage043_omat_route.rs"
      - "tests/stage043_mtls.rs"
      - "tests/stage043_mtls_cli.rs"
      - "tests/stage043_mtls_network.rs"
      - "src/stage043_store.rs"
      - "src/stage043_agent_store.rs"
      - "tests/stage043_agent_persistence.rs"
      - "src/stage043_signed_manifest.rs"
      - ".github/workflows/stage043-omas-omat.yml"

permissions:
  contents: read

jobs:
  native-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - name: Native OMAs and OMAt tenant/security regressions
        run: cargo test --locked --no-default-features --test stage043_security
      - name: Signed manifest authenticity and tenant acceptance
        run: cargo test --locked --no-default-features --test stage043_signed_manifest
      - name: Signed manifest persistence and revocation
        run: cargo test --locked --no-default-features --test stage043_persistence
      - name: Durable OMAs agent registry restart and capacity
        run: cargo test --locked --no-default-features --test stage043_agent_persistence
      - name: Signed OMAs agent admission and durable replay
        run: cargo test --locked --no-default-features --test stage043_signed_agent
      - name: mTLS peer registry security regressions
        run: cargo test --locked --no-default-features --test stage043_mtls
      - name: Standalone mTLS server fail-closed bootstrap
        run: cargo test --locked --no-default-features --test stage043_mtls_cli
      - name: Real mTLS network handshake and anonymous rejection
        run: cargo test --locked --no-default-features --test stage043_mtls_network
      - name: OMAt tenant-bound routing and connection-loss denial
        run: cargo test --locked --no-default-features --test stage043_omat_route
      - name: Standalone OMAs and OMAt process acceptance
        run: cargo test --locked --no-default-features --test stage043_cli
      - name: OMAs and OMAt existing unit tests
        run: |
          cargo test --locked --no-default-features omas_server::tests
          cargo test --locked --no-default-features omat_server::tests
      - name: OMAt Zenoh ingress compile gate
        run: cargo check --locked --features zenoh --lib --bin ocaf-omat-zenoh --bin ocaf-omas-zenoh-client
      - name: Zenoh production binary Clippy gate
        run: cargo clippy --locked --features zenoh --bin ocaf-omat-zenoh --bin ocaf-omas-zenoh-client -- -D warnings
      - name: Signed OMAs to OMAt Zenoh integration tests
        run: cargo test --locked --features zenoh --test stage043_omat_zenoh
      - name: Real two-process Zenoh TLS/mTLS restart and forced disconnect E2E
        run: |
          cargo build --locked --features zenoh --bin ocaf-omat-zenoh --bin ocaf-omas-zenoh-client
          bash scripts/stage043_zenoh_process_e2e.sh
      - name: Two-PKI Zenoh TLS/mTLS certificate overlap, withdrawal and in-flight ingress E2E
        timeout-minutes: 8
        run: |
          cargo build --locked --features zenoh --bin ocaf-omat-zenoh --bin ocaf-omas-zenoh-client
          bash scripts/stage043_zenoh_ca_rotation_e2e.sh
      - name: Stage 0.43 formatting (other stages have their own global gate)
        run: rustfmt --check --edition 2021 tests/stage043_security.rs src/omas_server.rs src/omat_server.rs src/bin/ocaf-omas-server.rs src/bin/ocaf-omas-mtls-server.rs src/bin/ocaf-omat-server.rs src/stage043_signed_manifest.rs tests/stage043_signed_manifest.rs src/stage043_store.rs tests/stage043_persistence.rs tests/stage043_cli.rs src/stage043_signed_agent.rs tests/stage043_signed_agent.rs src/stage043_agent_store.rs tests/stage043_agent_persistence.rs src/stage043_mtls_admission.rs tests/stage043_mtls.rs tests/stage043_mtls_cli.rs tests/stage043_mtls_network.rs src/stage043_omat_route.rs src/stage043_omat_zenoh.rs src/bin/ocaf-omat-zenoh.rs src/bin/ocaf-omas-zenoh-client.rs tests/stage043_omat_zenoh.rs tests/stage043_omat_route.rs
      - name: Stage 0.43 Clippy (all stage-owned tests and binaries)
        run: |
          cargo clippy --locked --no-default-features \
            --test stage043_security \
            --test stage043_signed_manifest \
            --test stage043_persistence \
            --test stage043_signed_agent \
            --test stage043_agent_persistence \
            --test stage043_mtls \
            --test stage043_mtls_cli \
            --test stage043_mtls_network \
            --test stage043_omat_route \
            --test stage043_cli \
            --bin ocaf-omas-server \
            --bin ocaf-omas-mtls-server \
            --bin ocaf-omat-server \
            -- -D warnings
