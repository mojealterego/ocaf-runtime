name: OCAF 0.39 experimental pinned-source guest kprobe KVM proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot-kprobe-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require actual KVM and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 scripts/stage039_kvm_ioctl.py --report "$RUNNER_TEMP/kvm.json"
          sudo -n apt-get update -qq
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex libelf-dev libssl-dev dwarves build-essential
      - name: Fetch pinned upstream Linux source, Firecracker and guest ext4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/kprobe-source"
          cd "$RUNNER_TEMP/kprobe-source"
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            --proto '=https' --tlsv1.2 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.188.tar.xz \
            -o linux-6.1.188.tar.xz
          echo 'ed4d0acb1307c235230c89efc094e210e6290593f94a7e617f28b1001101a33a  linux-6.1.188.tar.xz' | sha256sum --check -
          tar -xJf linux-6.1.188.tar.xz
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/20261023-dd7c24b0d165-0/x86_64/debug/vmlinux-6.1.188.config \
            -o firecracker-debug.config
          echo '05238c0baa2e1266abadaf5c2d90f70a04f2f2a644381f5c03452e9b98a624a4  firecracker-debug.config' | sha256sum --check -
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            https://github.com/firecracker-microvm/firecracker/releases/download/v1.17.0/firecracker-v1.17.0-x86_64.tgz \
            -o firecracker-v1.17.0-x86_64.tgz
          echo '06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558  firecracker-v1.17.0-x86_64.tgz' | sha256sum --check -
          tar -xzf firecracker-v1.17.0-x86_64.tgz
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            https://s3.amazonaws.com/spec.ccfc.min/img/hello/fsfiles/hello-rootfs.ext4 \
            -o hello-rootfs.ext4
          echo '786f0612582cadcee4c8ad46e30e4cc93dff9a3c0b4ede3f3c597b4c241dd547  hello-rootfs.ext4' | sha256sum --check -
      - name: Build upstream kernel with explicitly enabled kprobe and BTF
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/kprobe-source/linux-6.1.188"
          cp ../firecracker-debug.config .config
          # Upstream 6.1 KPROBES depends on MODULES. The Firecracker base
          # disables MODULES, so olddefconfig otherwise silently drops both.
          scripts/config --enable MODULES --enable KPROBES --enable KPROBE_EVENTS \
            --enable DEBUG_INFO_BTF --enable BPF_EVENTS --enable PERF_EVENTS \
            --enable BPF_SYSCALL
          make olddefconfig
          python3 - <<'PY'
          from pathlib import Path
          options=set(Path('.config').read_text().splitlines())
          required={f'CONFIG_{name}=y' for name in
                    ('MODULES','KPROBES','KPROBE_EVENTS','DEBUG_INFO_BTF','BPF_EVENTS',
                     'PERF_EVENTS','BPF_SYSCALL','VIRTIO_BLK','EXT4_FS')}
          assert required <= options, f'kernel did not retain requested features: {sorted(required-options)}'
          PY
          make -j 2 vmlinux
          # The broker admission cap is 128 MiB. Remove DWARF from the
          # distributable ELF while retaining the kernel's allocated BTF.
          objcopy --strip-debug vmlinux vmlinux-guest
          readelf -S vmlinux-guest | grep -F '.BTF'
          test "$(stat -c %s vmlinux-guest)" -le 134217728
          file vmlinux vmlinux-guest
          sha256sum .config vmlinux vmlinux-guest > "$RUNNER_TEMP/kprobe-source/built-sha256.txt"
      - name: Boot custom kernel under real Firecracker jailer and attach guest kprobe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SOURCE="$RUNNER_TEMP/kprobe-source"
          PREFIX="/opt/ocaf039-kprobe-${GITHUB_RUN_ID}"
          mkdir -p "$GITHUB_WORKSPACE/stage039-kprobe-evidence"
          sudo -n install -d -o root -g root -m 0700 "$PREFIX" "$PREFIX/approved" "$PREFIX/jailer"
          sudo -n install -o root -g root -m 0555 \
            "$SOURCE/release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64" "$PREFIX/approved/firecracker"
          sudo -n install -o root -g root -m 0555 \
            "$SOURCE/release-v1.17.0-x86_64/jailer-v1.17.0-x86_64" "$PREFIX/approved/jailer"
          sudo -n install -o root -g root -m 0444 \
            "$SOURCE/linux-6.1.188/vmlinux-guest" "$PREFIX/approved/guest_kernel"
          sudo -n install -o root -g root -m 0444 \
            "$SOURCE/hello-rootfs.ext4" "$PREFIX/approved/guest_rootfs"
          set +e
          sudo -n python3 scripts/stage039_guest_host_canary.py \
            --firecracker "$PREFIX/approved/firecracker" \
            --firecracker-sha256 "$(sudo -n sha256sum "$PREFIX/approved/firecracker" | cut -d ' ' -f 1)" \
            --jailer "$PREFIX/approved/jailer" \
            --jailer-sha256 "$(sudo -n sha256sum "$PREFIX/approved/jailer" | cut -d ' ' -f 1)" \
            --jailer-base "$PREFIX/jailer" \
            --kernel "$PREFIX/approved/guest_kernel" \
            --kernel-sha256 "$(sudo -n sha256sum "$PREFIX/approved/guest_kernel" | cut -d ' ' -f 1)" \
            --rootfs "$PREFIX/approved/guest_rootfs" \
            --rootfs-sha256 786f0612582cadcee4c8ad46e30e4cc93dff9a3c0b4ede3f3c597b4c241dd547 \
            --probe-source "$GITHUB_WORKSPACE/stage039/guest-kprobe/kprobe_canary_init.c" \
            --report "$GITHUB_WORKSPACE/stage039-kprobe-evidence/guest.json" \
            --ack-real-jailed-guest-canary-probe \
            2>&1 | tee stage039-kprobe-evidence/runner-diagnostic.txt
          runner_status=${PIPESTATUS[0]}
          set -e
          if (( runner_status != 0 )); then
            excerpt="$(tail -c 1400 stage039-kprobe-evidence/runner-diagnostic.txt | tr '\n' ' ' | tr '%' '_')"
            printf '::error title=Guest runner failure::%s\n' "$excerpt"
            exit "$runner_status"
          fi
          if ! sudo -n chown "$(id -u):$(id -g)" stage039-kprobe-evidence/guest.json; then
            echo '::error title=Guest proof validation::cannot read guest report after runner success'
            exit 1
          fi
          python3 - "$PREFIX" <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          def require(condition, reason):
              if not condition:
                  print(f'::error title=Guest proof validation::{reason}')
                  raise SystemExit(1)
          report=json.loads(Path('stage039-kprobe-evidence/guest.json').read_text())
          pins=(Path(os.environ['RUNNER_TEMP'])/'kprobe-source'/'built-sha256.txt').read_text()
          kernel_pins=re.findall(r'(?m)^([0-9a-f]{64})  vmlinux-guest$',pins)
          require(len(kernel_pins)==1,'missing unique built kernel SHA-256 receipt')
          serial=Path(sys.argv[1])/'jailer'/'firecracker'/report['vm_id']/'serial-console.log'
          # The jailer serial log is intentionally root-owned mode 0600.
          # Read only a bounded tail through sudo; do not weaken its ACL.
          raw=subprocess.run(['sudo','-n','tail','-c','65536',str(serial)],
                             check=True,capture_output=True,text=True).stdout
          hits=re.findall(r'(?m)^OCAF039_GUEST_KPROBE_PASS program_id=([1-9][0-9]*) event_count=([1-9][0-9]*)\r?$',raw)
          require(len(hits)==1,'missing unique positive guest kprobe pass marker')
          require('OCAF039_GUEST_KPROBE_FAIL' not in raw,'guest also emitted kprobe failure')
          require(report['live_vm']['firecracker_api_running'] is True,'Firecracker API not running at live probe')
          require(report['live_vm']['running_rootfs_fd']['rootfs_sha256']==report['rootfs_sha256'],'live rootfs FD digest mismatch')
          require(report['vm_sigkill']['cgroup_subtree_empty'] is True,'VM cgroup not drained after SIGKILL')
          require(report['stage_039_complete'] is False,'lab report incorrectly claims full stage completion')
          out={'status':'ONE_CUSTOM_PINNED_SOURCE_GUEST_KPROBE_ATTACHED_LAB_ONLY',
               'guest_kprobe_program_id':int(hits[0][0]),'guest_kprobe_event_count':int(hits[0][1]),
               'guest_vm_id':report['vm_id'],'guest_kernel_sha256':kernel_pins[0],
               'stage_039_22_complete':False,'stage_039_complete':False,'production_approved':False}
          Path('stage039-kprobe-evidence/kprobe-summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
          cp "$SOURCE/linux-6.1.188/.config" stage039-kprobe-evidence/kernel.config
          cp "$SOURCE/linux-6.1.188/vmlinux" stage039-kprobe-evidence/vmlinux
          cp "$SOURCE/linux-6.1.188/vmlinux-guest" stage039-kprobe-evidence/vmlinux-guest
          cp "$SOURCE/built-sha256.txt" stage039-kprobe-evidence/built-sha256.txt
      - name: Provision custom kernel, guest assets and host Aya for two brokered tenants
        shell: bash
        run: |
          set -euo pipefail
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-cryptography wabt e2fsprogs libc6-dev
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --manifest-path stage039/aya-guard/Cargo.toml --release --locked
          echo '992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95  stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf' | sha256sum --check -
          SOURCE="$RUNNER_TEMP/kprobe-source"
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          sudo -n install -d -o root -g root -m 0700 "$PREFIX" "$PREFIX/approved" "$PREFIX/jailer"
          sudo -n install -o root -g root -m 0555 "$SOURCE/release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64" "$PREFIX/approved/firecracker"
          sudo -n install -o root -g root -m 0555 "$SOURCE/release-v1.17.0-x86_64/jailer-v1.17.0-x86_64" "$PREFIX/approved/jailer"
          sudo -n install -o root -g root -m 0444 "$SOURCE/linux-6.1.188/vmlinux-guest" "$PREFIX/approved/guest_kernel"
          sudo -n install -o root -g root -m 0444 "$SOURCE/hello-rootfs.ext4" "$PREFIX/approved/guest_rootfs"
          sudo -n install -o root -g root -m 0444 stage039/aya-ebpf-egress/prebuilt/stage039-deny-egress.elf "$PREFIX/approved/aya_cgroup_device"
          sudo -n install -o root -g root -m 0500 stage039/aya-guard/target/release/ocaf-stage039-aya-guard "$PREFIX/approved/aya-guard"
          sudo -n python3 - "$PREFIX/approved" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          approved=Path(sys.argv[1])
          assets={name:{'path':str(approved/name),'sha256':hashlib.sha256((approved/name).read_bytes()).hexdigest()}
                  for name in ('firecracker','guest_kernel','guest_rootfs','aya_cgroup_device')}
          assert assets['guest_rootfs']['sha256']=='786f0612582cadcee4c8ad46e30e4cc93dff9a3c0b4ede3f3c597b4c241dd547'
          assert assets['aya_cgroup_device']['sha256']=='992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95'
          request={'schema_version':1,'workload_id':'ocaf-fc-kprobe-integration',
                   'tenant_id':'tenant-a','agent_id':'agent-a',
                   'isolation':{'hypervisor':'firecracker','jailer':True,'network':'none',
                                'guest_egress':False,'rootfs_readonly':True,
                                'mmds_enabled':False,'seccomp':'default','vcpus':1,'mem_mib':256},
                   'assets':assets}
          (approved/'request.json').write_text(json.dumps(request,sort_keys=True)+'\n')
          (approved/'request.json').chmod(0o600)
          PY
      - name: Prepare two distinct signed WASI guests with integrated kprobe probe
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          sudo -n env OCAF_STAGE039_KPROBE_INTEGRATION=1 \
            bash scripts/stage039_prepare_guest_wasi.sh "$PREFIX" "$GITHUB_WORKSPACE"
          sudo -n python3 - "$PREFIX/approved" <<'PY'
          import base64,json,sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          sys.path.insert(0,'scripts')
          from stage039_signed_manifest import canonical_payload
          root=Path(sys.argv[1]);key=Ed25519PrivateKey.generate()
          public=key.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          (root/'stage039-ci-public.key').write_bytes(public)
          (root/'stage039-ci-public.key').chmod(0o400)
          for tenant in ('a','b'):
              payload=json.loads((root/f'request-wasi-{tenant}.json').read_text())
              envelope={'key_id':'stage039-ci','public_key':base64.b64encode(public).decode(),
                        'signature':base64.b64encode(key.sign(canonical_payload(payload))).decode(),
                        'payload':payload}
              path=root/f'signed-wasi-{tenant}.json'
              path.write_text(json.dumps(envelope,sort_keys=True)+'\n')
              path.chmod(0o400)
          PY
      - name: Run two brokered jailed KVM guests with guest kprobe, Aya and WASI
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/opt/ocaf039-real-${GITHUB_RUN_ID}"
          IMAGE_A="$PREFIX/approved/guest_rootfs_wasi_a"
          IMAGE_B="$PREFIX/approved/guest_rootfs_wasi_b"
          sudo -n python3 scripts/stage039_broker_vm_binding.py \
            --manifest-a "$PREFIX/approved/request-wasi-a.json" \
            --manifest-b "$PREFIX/approved/request-wasi-b.json" \
            --approved-root "$PREFIX/approved" \
            --firecracker "$PREFIX/approved/firecracker" \
            --firecracker-sha256 "$(sudo -n sha256sum "$PREFIX/approved/firecracker" | cut -d ' ' -f 1)" \
            --jailer "$PREFIX/approved/jailer" \
            --jailer-sha256 "$(sudo -n sha256sum "$PREFIX/approved/jailer" | cut -d ' ' -f 1)" \
            --chroot-base "$PREFIX/jailer" --ledger-dir "$PREFIX/broker-wasi" \
            --aya-loader "$PREFIX/approved/aya-guard" \
            --aya-loader-sha256 "$(sudo -n sha256sum "$PREFIX/approved/aya-guard" | cut -d ' ' -f 1)" \
            --aya-program "$PREFIX/approved/aya_cgroup_device" \
            --aya-program-sha256 992cd7a365067f52bce5afe5ca9758dad0e15ad9291b71991914040faaa55c95 \
            --aya-seconds 12 --timeout 110 --require-guest-wasi \
            --signed-manifest-a "$PREFIX/approved/signed-wasi-a.json" \
            --signed-manifest-b "$PREFIX/approved/signed-wasi-b.json" \
            --trusted-public-key "$PREFIX/approved/stage039-ci-public.key" \
            --report "$GITHUB_WORKSPACE/stage039-kprobe-evidence/broker-pair.json" \
            --ack-broker-two-jailed-vm-real-kvm
          sudo -n python3 scripts/stage039_guest_kprobe_pair.py \
            --broker-report "$GITHUB_WORKSPACE/stage039-kprobe-evidence/broker-pair.json" \
            --jailer-base "$PREFIX/jailer" \
            --rootfs-sha256-a "$(sudo -n sha256sum "$IMAGE_A" | cut -d ' ' -f 1)" \
            --rootfs-sha256-b "$(sudo -n sha256sum "$IMAGE_B" | cut -d ' ' -f 1)" \
            --kernel-sha256 "$(sudo -n sha256sum "$PREFIX/approved/guest_kernel" | cut -d ' ' -f 1)" \
            --kernel-config "$RUNNER_TEMP/kprobe-source/linux-6.1.188/.config" \
            --kernel-config-sha256 "$(sha256sum "$RUNNER_TEMP/kprobe-source/linux-6.1.188/.config" | cut -d ' ' -f 1)" \
            --report "$GITHUB_WORKSPACE/stage039-kprobe-evidence/two-tenant-kprobe.json"
          sudo -n chown "$(id -u):$(id -g)" stage039-kprobe-evidence/broker-pair.json stage039-kprobe-evidence/two-tenant-kprobe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('stage039-kprobe-evidence/two-tenant-kprobe.json').read_text())
          assert result['status']=='TWO_BROKERED_JAILED_KVM_GUEST_KPROBE_AYA_WASI_LAB_PASS'
          assert result['host_aya_and_guest_aya_correlated'] is True
          assert set(result['tenants'])=={'a','b'}
          assert all(t['guest_kprobe_program_id']>0 and t['guest_kprobe_event_count']>0
                     and t['guest_aya_openat_program_id']>0 and t['guest_aya_openat_event_count']>0
                     for t in result['tenants'].values())
          assert result['stage_039_complete'] is False
          PY
      - name: Capture bounded guest failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage039-kprobe-evidence
          for label in kprobe real; do
            PREFIX="/opt/ocaf039-${label}-${GITHUB_RUN_ID}"
            if [[ -d "$PREFIX/jailer" ]]; then
              sudo -n find "$PREFIX/jailer" -name serial-console.log -type f -print -exec tail -c 4000 {} \; \
                | tee -a stage039-kprobe-evidence/serial-diagnostic.txt
            fi
            if [[ -d "$PREFIX/approved" ]]; then
              sudo -n find "$PREFIX/approved" -maxdepth 1 -type f \
                -printf '%f %s bytes mode=%m links=%n\n' \
                | tee -a stage039-kprobe-evidence/asset-diagnostic.txt
            fi
          done
          if [[ -f stage039-kprobe-evidence/serial-diagnostic.txt ]]; then
            excerpt="$(tail -c 1200 stage039-kprobe-evidence/serial-diagnostic.txt | tr '\n' ' ' | tr '%' '_')"
            printf '::warning title=Bounded guest serial diagnostic::%s\n' "$excerpt"
          fi
          if [[ -f stage039-kprobe-evidence/asset-diagnostic.txt ]]; then
            excerpt="$(tail -c 800 stage039-kprobe-evidence/asset-diagnostic.txt | tr '\n' ' ' | tr '%' '_')"
            printf '::warning title=Guest asset sizes::%s\n' "$excerpt"
          fi
      - name: Preserve custom-kernel lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage039-experimental-guest-kprobe-evidence
          path: stage039-kprobe-evidence/
          retention-days: 30
          if-no-files-found: warn
