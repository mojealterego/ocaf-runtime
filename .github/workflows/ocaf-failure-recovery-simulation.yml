name: OCAF failure and recovery simulation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ocaf-failure-recovery-simulation.yml'

permissions:
  contents: read

concurrency:
  group: ocaf-failure-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite-lease-recovery:
    name: Simulated lease, replay and recovery (single runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify distributed job state machine and signed RPC
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --test distributed_jobs_rpc -- --nocapture
          cargo test --locked --no-default-features --test rpc_cert_identity -- --nocapture
          cargo test --locked --no-default-features --test omas_dispatch -- --nocapture
          cargo test --locked --no-default-features --test persistent_replay -- --nocapture
      - name: Record simulation boundary
        if: always()
        run: |
          printf '%s\n' 'SIMULATION ONLY: single GitHub-hosted runner; not independent-host failover or Firecracker/KVM evidence.' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p evidence
          printf 'commit=%s\nrun=%s\nrunner=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(hostname)" > evidence/runner.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocaf-sqlite-recovery-${{ github.run_id }}
          path: evidence/
          retention-days: 30

  postgres-fencing:
    name: Simulated PostgreSQL epoch fencing (single runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocaf
          POSTGRES_PASSWORD: ocaf_ci_only
          POSTGRES_DB: ocaf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocaf -d ocaf_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      OCAF_TEST_PG_DSN: postgres://ocaf:ocaf_ci_only@127.0.0.1:5432/ocaf_ci
      OCAF_REQUIRE_PG_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require live PostgreSQL before tests
        run: |
          set -euo pipefail
          pg_isready -h 127.0.0.1 -p 5432 -U ocaf -d ocaf_ci
      - name: Test PostgreSQL fencing and leader recovery paths
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --test postgres_fenced_effect -- --nocapture
      - name: Record simulation boundary
        if: always()
        run: |
          printf '%s\n' 'SIMULATION ONLY: PostgreSQL service container shares a runner; not PostgreSQL HA, quorum, independent kernels or production recovery.' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p evidence
          printf 'commit=%s\nrun=%s\nrunner=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(hostname)" > evidence/runner.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocaf-postgres-fencing-${{ github.run_id }}
          path: evidence/
          retention-days: 30
