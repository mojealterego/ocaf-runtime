[package]
name = "omega-openai-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = "=0.8.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
reqwest = { version = "=0.12.22", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
async-stream = "0.3"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
