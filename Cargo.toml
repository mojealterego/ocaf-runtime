[package]
name = "ocaf_runtime"
version = "0.7.0"
edition = "2021"
publish = false
license = "MIT"
description = "OmniContext Agent Framework runtime core with fail-closed authorization"

[[bin]]
name = "ocaf-rpc-node"
path = "src/bin/ocaf-rpc-node.rs"
required-features = ["zenoh"]

[[bin]]
name = "ocaf-coordinator"
path = "src/bin/ocaf-coordinator.rs"
required-features = ["zenoh"]

[features]
default = ["zenoh"]
zenoh = ["dep:zenoh"]
full = ["zenoh"]

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
jsonschema = "0.33"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = { version = "1.10", optional = true }

[dev-dependencies]
tempfile = "3"
