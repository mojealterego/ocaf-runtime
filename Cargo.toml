[package]
name = "ocaf_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
zenoh = "1.10"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
once_cell = "1.5"

[[bin]]
name = "ocaf_runtime"
path = "src/main.rs"
