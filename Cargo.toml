[workspace]
members = [".", "crates/ocaf-stage-ledger", "crates/ocaf-transport-crdt"]
default-members = ["."]
resolver = "2"

[package]
name = "ocaf_runtime"
version = "0.26.0"
edition = "2021"
publish = false
license = "MIT"
description = "OmniContext Agent Framework runtime core with fail-closed authorization"

[[bin]]
name = "ocaf-cluster-health"
path = "src/bin/ocaf-cluster-health.rs"

[[bin]]
name = "ocaf-effect-sink"
path = "src/bin/ocaf-effect-sink.rs"
required-features = ["zenoh"]

[[bin]]
name = "ocaf-rpc-node"
path = "src/bin/ocaf-rpc-node.rs"
required-features = ["zenoh"]

[[bin]]
name = "ocaf-coordinator"
path = "src/bin/ocaf-coordinator.rs"
required-features = ["zenoh"]

[[bin]]
name = "ocaf-ha-probe"
path = "src/bin/ocaf-ha-probe.rs"
required-features = ["ha-probe"]

[[bin]]
name = "ocaf-omas-server"
path = "src/bin/ocaf-omas-server.rs"

[[bin]]
name = "ocaf-omas-mtls-server"
path = "src/bin/ocaf-omas-mtls-server.rs"

[[bin]]
name = "ocaf-omat-server"
path = "src/bin/ocaf-omat-server.rs"

[[bin]]
name = "ocaf-omat-zenoh"
path = "src/bin/ocaf-omat-zenoh.rs"
required-features = ["zenoh"]

[[bin]]
name = "ocaf-omas-zenoh-client"
path = "src/bin/ocaf-omas-zenoh-client.rs"
required-features = ["zenoh"]

[features]
ha-probe = []
tls-bound = ["zenoh", "dep:tokio-rustls", "dep:rustls"]
default = ["zenoh"]
zenoh = ["dep:zenoh"]
full = ["zenoh"]

[dependencies]
ocaf_stage_ledger = { version = "0.1.0", path = "crates/ocaf-stage-ledger" }
ocaf_transport_crdt = { version = "0.1.0", package = "ocaf-transport-crdt", path = "crates/ocaf-transport-crdt" }
async-trait = "0.1"
anyhow = "1.0"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
jsonschema = "0.33"
json5 = "0.4"
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-postgres = "0.7"
native-tls = "0.2"
openssl = "0.10"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false }
postgres-native-tls = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = { version = "1.10", optional = true, default-features = false, features = ["transport_tcp", "transport_tls"] }

[dev-dependencies]
tempfile = "3"

# Reviewed single-crate security backport (RUSTSEC-2026-0041).
[patch.crates-io]
zenoh-transport = { path = "vendor/zenoh-transport" }
# Compatibility backport: replace paste with maintained pastey (RUSTSEC-2024-0436).
token-cell = { path = "vendor/token-cell" }
# Reviewed Zenoh JSON5-only and rustls-pki-types security backports.
zenoh-config = { path = "vendor/zenoh-config" }
zenoh-link-commons = { path = "vendor/zenoh-link-commons" }
zenoh-link-tls = { path = "vendor/zenoh-link-tls" }
